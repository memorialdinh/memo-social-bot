# Weekly: makes sure your access keys still work. Opens an issue (you get an
# email from GitHub) if one is expiring or broken.
name: Key check
on:
  schedule:
    - cron: "5 16 * * 1"        # Mondays ~9 AM Pacific
  workflow_dispatch:
permissions: { contents: read, issues: write }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
        run: python -m bot.token_check
      - name: Open an issue if something needs attention
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if [ -s data/token_problems.md ]; then
            gh issue create --title "Social bot: a key needs attention" --body-file data/token_problems.md
          fi
