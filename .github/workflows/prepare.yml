# Renders graphics/reels, checks compliance and picks posting times
# whenever new content lands in queue/ (and every evening as a safety net).
name: Prepare content
on:
  push:
    paths: ["queue/**/*.yaml", "config.yaml"]
  schedule:
    - cron: "17 3 * * *"        # ~8:17 PM Pacific
  workflow_dispatch:
concurrency: { group: repo-writer, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -r requirements.txt
      - name: Check compliance
        run: python -m bot.validate
      - name: Render posts, stories and reels
        run: python -m bot.render
      - name: Pick posting times
        run: python -m bot.plan
      - name: Refresh dashboard
        run: python -m bot.dashboard
      - name: Save
        run: |
          git config user.name "memo-social-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A queue docs data
          git diff --cached --quiet || (git commit -m "bot: prepare content" && git pull --rebase && git push)
