name: Probe sources (temporary)
on: { push: { branches: [probe-data] } }
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash {0}
        run: |
          mkdir -p probe; UA="Mozilla/5.0 (memo-social-bot market data)"
          B=https://www2.census.gov/programs-surveys/acs/summary_file
          for y in 2024 2023; do curl -sS -m 60 -A "$UA" "$B/$y/table-based-SF/data/5YRData/" -o probe/dir_$y.html -w "dir $y %{http_code}\n" >> probe/log.txt; done
          for t in b25077 b25064 b25003 b25035 b25001; do curl -sS -m 300 -A "$UA" "$B/2024/table-based-SF/data/5YRData/acsdt5y2024-$t.dat" -o probe/$t.dat -w "$t %{http_code} %{size_download}\n" >> probe/log.txt; done
          curl -sS -m 120 -A "$UA" "$B/2024/table-based-SF/documentation/Geos20245YR.txt" -o probe/geos.txt -w "geos %{http_code} %{size_download}\n" >> probe/log.txt
          for t in b25077 b25064 b25003 b25035 b25001; do head -2 probe/$t.dat | cut -c1-400 >> probe/log.txt; grep -E "^1600000US0644000\|" probe/$t.dat | cut -c1-300 >> probe/log.txt; done
          head -2 probe/geos.txt | cut -c1-600 >> probe/log.txt
          grep -o 'href="[^"]*"' probe/dir_2024.html | head -20 >> probe/log.txt
          for t in b25077 b25064 b25003 b25035 b25001; do grep -E "^1600000US06" probe/$t.dat > probe/$t.ca.dat; rm probe/$t.dat; done
          grep -E "1600000US06" probe/geos.txt | head -3 >> probe/log.txt; rm probe/geos.txt
          ls -la probe >> probe/log.txt
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add probe; git commit -qm "probe output"; git push -q origin probe-data
