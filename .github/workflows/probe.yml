name: Probe sources (temporary)
on: { push: { branches: [probe-data] } }
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe; UA="Mozilla/5.0 (memo-social-bot market data)"
          for y in 2024 2023; do curl -sS -m 60 -A "$UA" "https://api.census.gov/data/$y/acs/acs5?get=NAME,B25077_001E,B25064_001E,B25003_001E,B25003_002E,B25035_001E,B25001_001E&for=place:*&in=state:06" -o probe/acs_$y.json -w "acs $y %{http_code}\n" >> probe/log.txt; done
          curl -sS -m 60 -A "$UA" "https://api.census.gov/data/2024/acs/acs5?get=NAME&for=county%20(or%20part):*&in=state:06%20place:*" -o probe/acs_place_county.json -w "pc %{http_code}\n" >> probe/log.txt || true
          curl -sS -m 60 -A "$UA" "https://api.census.gov/data/2020/dec/pl?get=NAME&for=county%20(or%20part):*&in=state:06%20place:*" -o probe/dec_place_county.json -w "decpc %{http_code}\n" >> probe/log.txt || true
          curl -sSL -m 60 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36" "https://www.car.org/aboutus/mediacenter/newsreleases" -o probe/car_list.html -w "carlist %{http_code}\n" >> probe/log.txt || true
          curl -sSL -m 60 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36" "https://www.car.org/aboutus/mediacenter/newsreleases/2026releases/sept2026sales" -o probe/car_sept.html -w "carsept %{http_code}\n" >> probe/log.txt || true
          curl -sSL -m 60 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36" "https://www.car.org/marketdata/data/housingdata" -o probe/car_housingdata.html -w "carhd %{http_code}\n" >> probe/log.txt || true
          ls -la probe >> probe/log.txt
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add probe; git commit -qm "probe output"; git push -q origin probe-data
