name: Probe sources (temporary)
on: { push: { branches: [probe-data] } }
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash {0}
        run: |
          mkdir -p probe; UA="Mozilla/5.0 (memo-social-bot market data)"
          for u in "https://api.census.gov/data/2024/acs/acs5?get=NAME,B25077_001E&for=place:44000&in=state:06" "https://api.census.gov/data/2023/acs/acs5?get=NAME,B25077_001E&for=place:44000&in=state:06" "https://api.census.gov/data.json"; do echo "== $u" >> probe/log.txt; curl -sS -m 90 -A "$UA" -D - -o /dev/null "$u" 2>&1 | head -15 >> probe/log.txt; done
          curl -sSL -m 150 -A "$UA" "https://api.census.gov/data/2024/acs/acs5?get=NAME,B25077_001E,B25064_001E&for=place:*&in=state:06" -o probe/acs_2024.json -w "acsL %{http_code} %{url_effective}\n" >> probe/log.txt 2>&1
          curl -sSL -m 150 -A "$UA" "https://www2.census.gov/geo/docs/reference/codes2020/place_by_cou/st06_ca_place_by_county2020.txt" -o probe/place_by_county.txt -w "pbc %{http_code}\n" >> probe/log.txt 2>&1
          head -c 600 probe/acs_2024.json >> probe/log.txt; head -5 probe/place_by_county.txt >> probe/log.txt
          ls -la probe >> probe/log.txt
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add probe; git commit -qm "probe output"; git push -q origin probe-data
