# Posts everything that's due. Runs every 15 minutes.
# (GitHub sometimes runs scheduled jobs a few minutes late — that's normal.)
name: Publish
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run: { description: "Dry run (don't actually post)", type: boolean, default: false }
concurrency: { group: repo-writer, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Publish due posts
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_ID: ${{ secrets.META_IG_ID }}
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
        run: python -m bot.publish ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Keep TikTok key fresh
        if: always() && hashFiles('data/.tiktok_refresh_token') != ''
        env: { GH_TOKEN: "${{ secrets.GH_PAT }}" }
        run: |
          if [ -n "$GH_TOKEN" ]; then gh secret set TIKTOK_REFRESH_TOKEN < data/.tiktok_refresh_token; fi
          rm -f data/.tiktok_refresh_token
      - name: Save status
        if: always()
        run: |
          git config user.name "memo-social-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A queue data
          git diff --cached --quiet || (git commit -m "bot: published" && git pull --rebase && git push)
