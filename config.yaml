# ─────────────────────────────────────────────────────────────
#  Memo Social Bot — main settings
#  Edit this file on GitHub (pencil icon) to change how the bot behaves.
#  Passwords / access keys NEVER go here — they go in GitHub Secrets.
# ─────────────────────────────────────────────────────────────

timezone: America/Los_Angeles

brand:
  name: "Memo Dinh"
  title: "Real Estate Consultant"
  team: "Prestige Luxury Group"
  brokerage: "Epique Realty"
  dre: "02066757"
  phone: "562-253-9034"
  website: "theprestige.luxe"
  agent_site: "joinmemo.netlify.app"      # used on agent-attraction posts
  booking: "tidycal.com/memorialdinh/15-minute-call"
  colors:
    obsidian: "#101010"
    slate: "#545451"
    carbon: "#d9d6d1"
    gold: "#bca480"
  # Added to the END of every caption automatically (unless already there).
  compliance_footer: "Memo Dinh | DRE #02066757 | Epique Realty | Equal Housing Opportunity. Not legal, tax or lending advice."
  agent_compliance_footer: "Memo Dinh | DRE #02066757 | Epique Realty. Revenue share & equity programs are subject to Epique's current plan terms and eligibility; no income is guaranteed."

# Turn a platform off by setting enabled: false
platforms:
  instagram: { enabled: true }
  facebook:  { enabled: true }
  linkedin:  { enabled: true }
  tiktok:    { enabled: true, mode: inbox }   # inbox = lands in your TikTok drafts, you tap Post

# What gets posted where
routing:
  post:  [instagram, facebook, linkedin, tiktok]   # TikTok gets an animated version
  reel:  [instagram, facebook, linkedin, tiktok]
  story: [instagram, facebook]                      # LinkedIn/TikTok have no story API

# Daily volume the content writer aims for
daily_mix:
  post: 3
  reel: 2
  story: 5

# Content tracks and how often each should appear (relative weights)
tracks:
  market_update:      { weight: 3, label: "MARKET UPDATE" }
  buyer_education:    { weight: 3, label: "BUYER TIP" }
  seller_education:   { weight: 3, label: "SELLER TIP" }
  agent_attraction:   { weight: 2, label: "FOR AGENTS" }
  laws_and_updates:   { weight: 1, label: "NEW LAW ALERT" }
  investment:         { weight: 2, label: "INVESTOR MATH" }
  local_spotlight:    { weight: 1, label: "LOCAL SPOTLIGHT" }
  humor:              { weight: 2, label: "REAL TALK" }       # memes — see CONTENT_BRIEF
  motivation:         { weight: 2, label: "MONDAY" }          # inspiring / empowering, quote template
  community:          { weight: 0, label: "BIRTHDAY CLUB" }   # written by the engagement brain, not the daily writer

# Every graphic ends with a "Your next step" button. When a post doesn't set
# design.cta, the button uses the line for its track below.
default_cta:
  market_update:    "DM 'VALUE' for your home's number"
  buyer_education:  "DM 'BUYER' for my buyer roadmap"
  seller_education: "Comment 'SELLER' for my seller plan"
  agent_attraction: "DM 'MATH' for the cost breakdown"
  laws_and_updates: "DM me your question on this"
  investment:       "DM 'INVEST' for the worksheet"
  local_spotlight:  "DM 'BUYER' to see homes here"
  humor:            "Follow for real talk + real numbers"
  motivation:       "DM 'BUYER' and we'll map your numbers"
  community:        "DM 'BDAY' to join the Birthday Club"

# Safety: these tracks always wait for your approval before posting.
# Everything else posts automatically once the writer marks it approved.
require_approval_tracks: [laws_and_updates]
# Set to true if you want to approve EVERYTHING by hand.
require_approval_all: false

schedule:
  # Used until the analytics bot has enough data to pick times for you.
  default_feed_hours: [8, 19, 9, 20, 7, 21]     # posts + reels, in order of preference
  # Reels and static posts peak in DIFFERENT windows on this account. From 98
  # Instagram posts, May-Oct 2026 (full numbers in knowledge/timing-notes.md):
  #   reels    9am-12pm  8.4 engagements/post (n=20)  <- best
  #            6-11pm    5.3/post, but the highest reach of any window (241)
  #            5-8am     5.9/post (n=21)
  #   static   6-11pm   13.6/post (n=5 - thin, treat as directional)
  #            5-8am     7.5/post (n=11)
  #            9am-12pm  2.5/post (n=11)  <- worst for static
  reel_hours: [9, 10, 11, 7, 12, 8, 21]
  post_hours: [19, 20, 21, 7, 8, 18]
  story_hours: [7, 10, 12, 19, 20]
  # 1-5pm averaged 3.5 engagements/post against 6.3-8.3 in every other window,
  # on the lowest reach and views too. Instagram's online-followers curve peaks
  # in exactly this window, which is why "post when your audience is online"
  # reads as wrong here. Dropped last, after the preferred hours; plan_day still
  # falls back to the full day if a crowded day leaves nothing else.
  avoid_hours: [13, 14, 15, 16, 17]
  earliest_hour: 7
  latest_hour: 21
  # Between feed posts on the same platform. Dropped 90 -> 60 on Oct 28 2026:
  # with 6 feed items a day (5 + the campaign w1), a 90-minute gap left only
  # five seats in the strong windows and pushed the sixth into 1-5pm, which
  # costs about half its engagement. 60 opens the adjacent hours so all six
  # land in 7am-12pm or 6-9pm. 50 rather than 60 because posts carry a :02-:11
  # jitter, so two consecutive hours can sit only 51 minutes apart (11:11 then
  # 12:02) - at 60 the planner rejected the next hour and fell through to the
  # afternoon anyway. If the daily feed count ever drops back to 3-4, put this
  # back to 90.
  min_gap_minutes: 50
  use_best_times: true                         # let analytics pick the hours once it has data
  max_late_hours: 6                            # if a post is more than this late, skip it

headshots:
  # The SAME headshot goes on every post. Upload it to assets/headshots/ and put
  # its file name here (blank = first file in the folder).
  primary: "memo.png"

# Every post gets a different look automatically (5 luxury color themes x 6
# background accents x layouts), with the gold-foil type, hairline rules, the
# headshot medallion and a "Your next step" button on every graphic.
# To force one for a post, add  theme: noir|silver|ivory|goldrush|graphite
# under design: in that post's file.

api:
  graph_version: "v25.0"        # Meta Graph API version
  linkedin_version: "202609"    # LinkedIn API version (YYYYMM). Bump yearly.
  instagram_online_followers_tz: America/Los_Angeles
