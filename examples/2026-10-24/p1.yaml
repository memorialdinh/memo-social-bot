  headline: Touring homes in CA? You'll sign *this* first.
  points:
  - California requires a written buyer representation agreement before an agent works with you (AB 2992, effective Jan 1, 2025).
  - It spells out what you're paying, if anything, and how long it lasts.
  - Read it, ask questions, negotiate the terms.
  cta: DM me 'AGREEMENT' for a plain-English breakdown
