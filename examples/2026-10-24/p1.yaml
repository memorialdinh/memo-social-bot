  instagram: 'Planning to tour homes this weekend? Quick heads up 👇


    In California, agents need a signed, written buyer representation agreement before working with you. Not a trick. It''s there so you know exactly what you''re agreeing to and what it costs.


    Save this before your first showing. DM me "AGREEMENT" and I''ll walk you through one line by line.


    #CaliforniaRealEstate #FirstTimeHomeBuyer #LongBeachRealEstate #SouthBayHomes #BuyerTips'
  facebook: 'Before you tour your first home in California, you''ll be asked to sign a written buyer representation agreement. It''s required under AB 2992 (effective Jan 1, 2025).


    What it covers: how your agent gets paid, how long the agreement lasts, and what happens if you want out. Everything is negotiable.


    Questions? Comment below or message me. I''m happy to walk you through one before you sign anything.'
  linkedin: 'Since Jan 1, 2025, California requires a written buyer representation agreement before an agent works with a buyer (AB 2992).


    For agents: this is a transparency win. Buyers who understand the agreement up front trust you more, not less.


    For buyers: read it, ask about compensation and term length, and negotiate.


    How are you walking clients through it?'
