captions:
  instagram: 'Thinking about downsizing but scared of a new property tax bill? 🏡


    Under Prop 19, eligible California homeowners 55+ can transfer their property tax base to a replacement home anywhere in the state, up to 3 times. Price rules apply, so run the numbers first.


    Comment "PROP 19" and I''ll send you the checklist.


    #Prop19 #DownsizingTips #SellerTips #LosAngelesRealEstate #OrangeCountyHomes'
  facebook: 'Empty nesters: Prop 19 lets eligible homeowners 55+ take their property tax base with them, anywhere in California, up to three times.


    There are timing and price rules, so talk to your tax pro and an agent before you list. Comment "PROP 19" and I''ll send the checklist I use with clients.'
  linkedin: 'One of the most underused tools for older California homeowners: Prop 19.


    Eligible owners 55+ can transfer their tax base to a replacement home anywhere in the state, up to three times. For many, that''s what unlocks a move they''ve been putting off.


    Agents: are you bringing this up in your listing consults?'
