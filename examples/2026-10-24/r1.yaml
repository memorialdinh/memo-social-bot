topic: What agents should ask before picking a brokerage
approved: true
design:
  kicker: FOR AGENTS
  headline: Before you switch brokerages, ask *these 4*.
  points:
  - What's my total cost per deal, all fees included?
  - Is there a cap? What happens after I hit it?
  - What do I get for my split besides a logo?
  - Is there revenue share or equity, and how does it vest?
  cta: Comparing options? DM me 'MATH'
