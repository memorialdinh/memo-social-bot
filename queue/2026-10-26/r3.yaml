captions:
  instagram: '48 pages. Six of them are photos of the same outlet.


    By page 12 you are convinced the house is held together by paint. By page 30 you have accepted it.


    Then there is one line, usually buried in the middle, about the thing that actually costs money. Sewer line. Panel. Roof age.


    My job is not to talk you out of the 48 pages. It is to tell you which line is a negotiation and which line is a Saturday.


    Comment the worst thing yours turned up. I will go first: a water heater strapped with a bungee cord 👇


    #HomeInspection #HomeBuyingTips #FirstTimeHomeBuyer #LongBeachRealEstate #RealTalk'
  facebook: 'The home inspection report is 48 pages long and I have never once seen a buyer skip a page.


    Page 4: the outlet in the garage is upside down. Page 9: a photo of a hairline crack from six inches away, which makes it look like the San Andreas. Page 17: "recommend evaluation by qualified professional," which appears roughly thirty times.


    Somewhere around page 12 every first-time buyer texts me some version of "should we walk away from this." By page 30 they have made peace with it.


    And then there is one line, almost always buried in the middle, that is the whole report. Sewer lateral. Electrical panel. Age of the roof. That is the one worth money.


    My actual job is not calming you down about the 48 pages. It is telling you which line is a negotiation, which line is a Saturday with a YouTube video, and which line means we rethink this.


    No inspection comes back clean. Not one. A thick report is not a bad house, it is a thorough inspector.


    What is the strangest thing an inspection ever turned up on you?


    #HomeInspection #LongBeachRealEstate #HomeBuying'
  linkedin: 'Every inspection report is 48 pages, and the client reads all 48.


    Page 4, an upside-down outlet. Page 9, a hairline crack photographed from six inches away. Page 17, "recommend evaluation by a qualified professional," which by my count appears about thirty times in an average report.


    Somewhere around page 12, a first-time buyer decides the house is condemned. By page 30 they have made peace with it. And buried in the middle is the one line that actually matters: the sewer lateral, the panel, the age of the roof.


    There is a real lesson under the joke. An inspection report has no severity ranking built into it. A loose handrail and a failing sewer line get the same font. The value an agent adds at that moment is triage, which line is a price conversation, which line is a weekend, and which line is a reason to stop.


    If your client is panicking at page 12, that is not a client problem. It is a report nobody has sorted for them yet.


    How do you walk clients through an inspection without either minimizing it or scaring them off?


    #RealEstate #HomeInspection #HomeBuying'
