  facebook: 'A quick calendar note for LA County homeowners.


    Your Annual Secured Property Tax Bill goes out in October. The first installment is due November 1 and becomes delinquent after December 10. If it is late, LA County adds a 10% penalty.


    The second installment is due February 1 and becomes delinquent after April 10. That one carries a 10% penalty plus a $10 cost if it is late.


    Two practical notes. If your mortgage has an impound account your lender is probably handling this, but it is worth opening the bill and confirming the numbers look right. And if you bought or refinanced this year, double check where the bill was mailed.


    Worth knowing: the bill is calculated on assessed value, which is a different number from what your home would sell for today. People are often surprised by the gap in both directions.


    If you are curious what yours would actually sell for, comment VALUE and I will put together an estimate for you. It is an estimate, not an appraisal.


    In a different county? Check your own tax collector, the dates are not always posted the same way.


    #LongBeachRealEstate #PropertyTax #LACounty'
  linkedin: 'A date worth putting in front of clients this week: the LA County Annual Secured Property Tax Bill first installment is due November 1, and becomes delinquent after December 10. A late first installment carries a 10% penalty. The second installment is due February 1, delinquent after April 10, with a 10% penalty plus a $10 cost.


    The reason this is worth a reminder rather than a footnote: the bill arrives in October, in the middle of the slowest stretch of the year for homeowner attention, and a large share of owners assume impound covers it without ever opening the envelope. For anyone who closed or refinanced in 2026, the mailing address on the bill is the thing most likely to be wrong.


    It is also a useful opening for a conversation most owners have not had, because assessed value and current market value are two different numbers, and the gap tends to be larger than people expect.


    General information only, not tax advice. Dates here are LA County''s; other counties post their own.


    How are you using the November deadline as a touchpoint with past clients?


