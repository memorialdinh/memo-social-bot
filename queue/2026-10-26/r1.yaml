captions:
  instagram: 'Your sale price is not your check. Save this one.


    What comes out first:


    Commissions. Negotiable, agreed in writing before you list, never set by law.


    County documentary transfer tax, $1.10 per $1,000 of value in LA County. On a $900,000 sale that is $990.


    City transfer tax, if your city charges one. The City of LA adds $2.25 per $500 as of July 2026. Culver City, Santa Monica, Pomona and Redondo Beach have their own.


    Then escrow, title, recording, prorated property taxes, your loan payoff, and anything you agreed to credit the buyer.


    None of this is a surprise if you see it before you list. DM me SELLER and I will build yours 👇


    #HomeSelling #SellerTips #LongBeachRealEstate #SouthBayHomes #TorranceRealEstate #CulverCity'
  facebook: 'The number that matters when you sell is not the sale price. It is what lands in your account after everything comes out. Here is the list, in the order it hits.


    Commissions. These are negotiable and agreed in writing before your home goes on the market. They are not set by law and never have been.


    County documentary transfer tax. In LA County that is 55 cents per $500 of value, which works out to $1.10 per $1,000. On a $900,000 sale, $990.


    City transfer tax, if your city has one, charged on top of the county''s. The City of Los Angeles is $2.25 per $500 as of July 1, 2026. Culver City, Santa Monica, Pomona and Redondo Beach each set their own. A lot of sellers find this one late.


    Then the ordinary ones: escrow fees, title, recording, prorated property taxes up to your closing date, your remaining loan payoff, any repairs or closing costs you agreed to cover, and an HOA document fee if you are in an association.


    Who pays which line is customary, not automatic, and it gets negotiated in the contract.


    The point of a net sheet is that you see all of this before you pick a list price, not after you are in escrow. Comment SELLER and I will build one for your place.


    Which of these was the surprise for you last time you sold?


    #SellingYourHome #LongBeachRealEstate #SouthBayHomes'
  linkedin: 'Sellers consistently anchor on the sale price and get surprised by the net. The fix is showing them the whole stack before the list price conversation, not after.


    What comes off the top, in LA County:


    Commissions, which are negotiable and agreed in writing before listing. Worth stating plainly in every consult now that buyers and sellers are both paying closer attention to how this is papered.


    County documentary transfer tax at 55 cents per $500 of value, so $1.10 per $1,000, under Revenue and Taxation Code sections 11911 to 11933. On a $900,000 sale, $990.


    City documentary transfer tax where the city imposes one, charged in addition to the county''s. The City of Los Angeles is $2.25 per $500 effective July 1, 2026, with additional percentage tiers on high-value sales. Culver City, Santa Monica, Pomona and Redondo Beach publish their own schedules. This line is the one most often missed in a quick estimate.


    Then escrow, title, recording, prorated taxes, loan payoff, negotiated credits and HOA document fees.


    Who customarily pays each line is a local convention and a contract term, not a rule. The county recorder''s page does not assign it either way.


    A net sheet delivered before pricing changes the conversation from hope to arithmetic.


    #RealEstate #HomeSelling #RealEstateAdvice'
