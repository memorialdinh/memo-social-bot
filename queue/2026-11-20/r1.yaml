  linkedin: |-
    A pattern worth naming for anyone advising sellers: the offer comparison almost always starts with price, and price is the part of an offer least likely to change what actually happens next.

    The financing terms are where the risk sits. Five lines that deserve a read before acceptance:

    The loan type, because appraisal rules, timelines and repair expectations differ across cash, conventional, FHA and VA. Whether the buyer holds a pre-approval or a pre-qualification, which are not the same document. The source and seasoning of the down payment funds. The length of the loan contingency, which defines the window in which the buyer can withdraw with their deposit intact. And whether the appraisal contingency has been waived, which determines what happens if the valuation lands under the contract price.

    The point is not that one loan type is preferable. It is that the strongest-looking offer and the most likely offer to close are not automatically the same offer, and the difference is usually visible before acceptance rather than after.

    For the agents and lenders here: which of these five do you find sellers are most often surprised by?

