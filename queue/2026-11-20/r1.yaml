captions:
  default: |-
    Two offers can show the same price and close completely differently.

    The price is the headline. The loan behind it is the story.

    Five things worth knowing before you sign:

    1. The loan type. Cash, conventional, FHA or VA. Each one has its own appraisal rules, its own timeline and its own repair expectations.

    2. Pre-approval or pre-qualification. A pre-qualification is a conversation. A pre-approval means a lender actually looked at documents.

    3. The down payment, and where it is coming from. Money that has been in the account for months behaves differently than money that arrived last week.

    4. The loan contingency window. That is how long the buyer can walk and keep their deposit while the loan is still being underwritten.

    5. The appraisal contingency. Still in, or waived? That one line decides what happens if the appraisal comes in under your price.

    None of this means you should pick one loan type over another. It means you should know which one you are agreeing to before you agree to it.

