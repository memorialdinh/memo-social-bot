captions:
  instagram: 'I bring six comps. We talk about one.


    It''s always the highest one. I get it — it''s the number you want to be true.


    But buyers price your house against all six. So does the appraiser.


    The high comp is usually high for a reason: a remodel, a bigger lot, a better street. Find the reason and you find your real range.


    Comment ''SELLER'' and I''ll send you the actual six for your block.


    #RealEstateHumor #HomePricing #LongBeachRealEstate #SouthBayHomes #SellingYourHome #SoCalRealEstate'
  facebook: 'Every listing appointment goes the same way, and I say this with love.


    I show up with six comparable sales. Six houses, same area, closest match on size, condition and date. We look at all six for about ninety seconds. Then we spend twenty minutes on the highest one.


    I understand it completely. That number is the one you''ve been carrying around since your neighbor sold.


    Here''s the problem: buyers don''t price your house against your favorite comp. They price it against all six, because that''s what they''re also looking at. An appraiser does the same thing, and they have to defend it in writing.


    The useful move is to ask why the high one was high. Usually there''s a real answer — a kitchen that was redone last year, an extra two hundred square feet, a corner lot, a quieter street. Sometimes that answer applies to your house too. When it does, you just earned it honestly instead of hoping for it.


    What''s the one comp in your neighborhood you can''t stop thinking about?


    #HomePricing #SoCalRealEstate'
  linkedin: 'A pattern I see on nearly every listing appointment: a seller will engage with six comparable sales for about a minute, then spend the rest of the meeting on the single highest one.


    It isn''t stubbornness. It''s an anchor. That number usually arrived socially — a neighbor''s sale, a figure overheard months ago — and it set an expectation before any analysis started.


    The reframe that tends to work is not arguing the number down. It''s asking what made that sale an outlier: recent renovation, additional square footage, lot position, street. Once the premium has a named cause, the conversation moves from whether the price is fair to whether that cause applies to this property. Often part of it does, and the seller gets there on evidence instead of hope.


    The takeaway for anyone advising sellers: don''t debate the anchor, explain it.


    How do you handle an anchored seller?


    #RealEstate #HomePricing #ListingStrategy'
