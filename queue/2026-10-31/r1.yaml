captions:
  instagram: 'Two homes, same price, very different monthly cost. This is often why 📄


    Your base property tax follows value. Proposition 13 (1978) limits the annual tax on real property to one percent of full cash value, plus up to a 2% inflation factor.


    A special assessment doesn''t work that way. The California Department of Real Estate puts it plainly: special assessments are "levied for the cost of a public improvements or services such as streets, sewers, irrigation, and drainage," and "these assessments are not based on the value of the property."


    So it doesn''t shrink when values soften. Run it as a fixed monthly line, not a percentage.


    And Mello-Roos: per the DRE, Civil Code Section 1102.6b requires a seller of one to four dwelling units to disclose a Mello-Roos assessment. Ask for it in writing. Read it before you remove contingencies.


