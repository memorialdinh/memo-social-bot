  facebook: 'Two homes list at the same price. One costs meaningfully more every month. A lot of the time, this line is why.


    Here''s the distinction worth knowing.


    Your base property tax follows value. Proposition 13, passed in June 1978, amended the State Constitution so the maximum annual tax on real property is limited to one percent of full cash value, plus a maximum two percent annual inflation factor.


    A special assessment is a different animal. The California Department of Real Estate describes them as "levied for the cost of a public improvements or services such as streets, sewers, irrigation, and drainage," and states directly that "these assessments are not based on the value of the property."


    That sentence is the whole lesson. Because it isn''t tied to value:


    • It doesn''t fall when values fall.

    • It doesn''t scale down because you negotiated the price down.

    • It belongs in your monthly math as a fixed number, not as a percentage of anything.


    On Mello-Roos specifically, the DRE reference book notes that Civil Code Section 1102.6b requires a seller of one to four dwelling units to disclose a Mello-Roos assessment. So ask for it, get it in writing, and read it before your contingencies come off — not after.


    Where this bites hardest is an investor''s cash flow model. A fixed charge that doesn''t flex with value or rent is exactly the kind of line that turns a spreadsheet that worked into one that doesn''t.


    General information only, not tax or legal advice. Your county tax collector and your CPA are the right calls for your specific parcel.


    DM me INVEST and I''ll send you the worksheet I use.


    Source: California Department of Real Estate, Reference Book, Chapter 16, "Taxation and Assessments".


    #RealEstateInvesting #PropertyTaxes #SoCalRealEstate'
  linkedin: 'A distinction that changes an underwriting model more often than it gets discussed.


    Ad valorem tax follows value. Proposition 13 (1978) limits the maximum annual tax on real property to one percent of full cash value, plus a maximum two percent annual inflation factor.


    Special assessments do not. The California Department of Real Estate states that special assessments are "levied for the cost of a public improvements or services such as streets, sewers, irrigation, and drainage," and that "these assessments are not based on the value of the property."


    Three consequences for anyone running numbers on a California parcel:


    A fixed charge does not compress when valuations compress, so it is a floor in your expense model rather than a variable.


    Negotiating purchase price down does not reduce it.


    Modeling it as a percentage of value understates it in a soft market and overstates it in a strong one. Pull the actual figure from the bill.


    On disclosure, the DRE reference book cites Civil Code Section 1102.6b requiring a seller of one to four dwelling units to disclose a Mello-Roos assessment. Worth confirming during due diligence rather than at closing.


    General information, not tax or legal advice.


    Source: California Department of Real Estate, Reference Book, Chapter 16.


