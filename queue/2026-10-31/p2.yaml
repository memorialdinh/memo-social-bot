  facebook: 'For the agents asking me what''s actually included: here''s the marketing side, in Epique''s own words, with the fine print attached.


    What the site lists:


    "Free Buyer & Seller Leads" — described as "Buyer and seller leads, no extra cost."

    "Free Social Media Ads" — "We promote your business across Meta and Google, no ad spend out of pocket."

    "Free Luxury Yard Signs" — "Heavy-gauge metal signs that elevate your brand at the curb."

    "Thanks.io Direct Mail" — "Automated handwritten-style postcards and letters that hit mailboxes for you."

    "Adwerx TV Streaming Ads" — "Promote your listings on connected TV, Hulu, Roku, and more."


    That''s a real stack. Now the three things I''d want someone to tell me before I signed anything, all of which are on Epique''s own pages:


    1. There''s a monthly technology fee. The Independent Contractor Agreement states: "The technology fee is $149 a month." That document is dated 04/27/2025.


    2. Some of the best items are regional. Sign installation, agent billboards, listing billboards and professional photography all sit under a section labeled "Available in Select Areas only." Whether they exist in your market is a question for your market, not for a homepage.


    3. There are exclusions. The ICA says it plainly: benefits "including, but not limited to: Free Listing Photos, Facebook Ads, Free Signage and Installation does not apply to leases, lots, or land." If a meaningful share of your business is land or leases, that matters to you specifically.


    I''m not going to pretend the fine print isn''t there. The stack is good and it costs something and it has edges — all three are true at once, and you can only compare brokerages honestly if you''re holding all three.


    Ask me these questions. Ask the brokerage you''re at now the same ones.


    Subject to Epique''s current plan terms and eligibility.


    DM me MATH and I''ll go through the monthly math with you.


    #RealEstateAgents #RealtorLife #BrokerageMove'
  linkedin: 'A note for agents evaluating a brokerage move, using a category that usually gets skipped: marketing infrastructure.


    What Epique lists as included, quoting its own descriptions: buyer and seller leads "no extra cost"; social ads where "We promote your business across Meta and Google, no ad spend out of pocket"; "Heavy-gauge metal signs"; Thanks.io direct mail producing "Automated handwritten-style postcards and letters"; and Adwerx connected-TV placement.


    The more useful exercise is reading the constraints alongside it, all of which are published:


    Cost. The Independent Contractor Agreement (dated 04/27/2025) states: "The technology fee is $149 a month." Any "included" list should be read against a recurring number.


    Geography. Sign installation, billboards and professional photography appear under a heading marked "Available in Select Areas only." Regional availability is not a detail; for a specific agent it is the whole answer.


    Exclusions. The ICA states that benefits "including, but not limited to: Free Listing Photos, Facebook Ads, Free Signage and Installation does not apply to leases, lots, or land."


    None of that argues against the platform. It argues for doing the comparison properly. An agent who moves on a feature list and discovers the geography clause afterward has made a decision on incomplete information, and that is avoidable in about twenty minutes of reading.


    Subject to Epique''s current plan terms and eligibility.


    Agents and team leaders: what''s the question you wish you''d asked before your last move?


    #RealEstate #Recruiting #Brokerage'
