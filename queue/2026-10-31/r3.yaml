captions:
  instagram: 'Three dates, one calendar note, five seconds of your time 🗓️


    1. Nov 1 — the first installment of the LA County annual secured property tax bill is due. The bill goes out in October.


    2. Dec 10 — that''s the delinquency date. Per the LA County Property Tax Portal, the first installment "becomes delinquent and will be subject to a 10 percent penalty" if it isn''t received or USPS postmarked on or before Dec 10. In another county? Check your own tax collector.


    3. Thursdays at 9am PT — Freddie Mac publishes the week''s mortgage rate averages. Per Freddie Mac: "PMMS results are released weekly on Thursdays at 12 p.m. ET."


    Where it stands now: the 30-year fixed averaged 7.32% and the 15-year 6.68%, both as of October 22, 2026 (Freddie Mac PMMS). A survey average, not a quote, and not a loan offer — your rate depends on your file.


    DM me RATES and I''ll send you this week''s numbers 👇


    #SoCalRealEstate #MortgageRates #PropertyTaxes #LongBeachRealEstate #HousingMarket #RealEstateTips'
  facebook: 'Three dates worth putting in your phone before November starts.


    Nov 1 — the first installment of the LA County annual secured property tax bill is due. The Treasurer and Tax Collector prepares and mails the annual bills in October, so it should already be in hand.


    Dec 10 — the delinquency date for that first installment. The LA County Property Tax Portal states it "becomes delinquent and will be subject to a 10 percent penalty if payment is not received or postmarked by the United States Postal Service (USPS) on or before December 10." Worth noting the postmark language. If you''re in Orange, Riverside or San Bernardino County, check your own tax collector''s page — these are the LA County dates.


    Thursdays at 9am Pacific — Freddie Mac publishes its weekly mortgage rate survey. Their own wording: "PMMS results are released weekly on Thursdays at 12 p.m. ET. and are an average of loan rates offered the prior Thursday through Wednesday."


    Where rates stand as of this writing: the 30-year fixed-rate mortgage averaged 7.32% as of October 22, 2026, down from 7.40% the prior week. The 15-year averaged 6.68%. A year earlier the 30-year averaged 6.19%.


    One caveat that matters: that''s a national survey average, not a quote. It isn''t a loan offer, and your own number depends on your credit, your down payment and your loan type. A lender running your actual file is the only way to know yours.


    Comment or DM RATES and I''ll send you the current numbers.


    #SoCalRealEstate #MortgageRates #PropertyTaxes'
  linkedin: 'Three dates on the November calendar, with sources.


    November 1 — the first installment of the Los Angeles County annual secured property tax bill is due. Annual bills are prepared and mailed in October.


    December 10 — the delinquency date for that installment. The LA County Property Tax Portal states the first installment "becomes delinquent and will be subject to a 10 percent penalty" absent receipt or USPS postmark on or before that date. These are LA County dates; other counties should be confirmed with their own collector.


    Thursdays, 9am Pacific — Freddie Mac''s weekly Primary Mortgage Market Survey. Per Freddie Mac, results are "released weekly on Thursdays at 12 p.m. ET" and average loan rates offered the prior Thursday through Wednesday.


    Current reading: the 30-year fixed averaged 7.32% as of October 22, 2026, against 7.40% the prior week and 6.19% a year earlier. The 15-year averaged 6.68%.


    A national survey average is a benchmark for direction, not a quote for any individual borrower, and it is not a loan offer. For clients, the number that matters comes from a lender reviewing their file.


    #RealEstate #HousingMarket #MortgageRates'
