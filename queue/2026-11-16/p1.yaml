captions:
  default: '18% of households in the Los Angeles metro area could afford the median-priced home in the third quarter of 2026. A year earlier it was 16%.


    That''s not a boom. It''s two points, and it''s still fewer than one in five.


    C.A.R.''s third-quarter 2026 affordability index, released Oct 30, 2026:


    LA metro area - 18%, up from 16% in 3Q 2025

    Inland Empire - 26%, up from 23%

    California - 19%, unchanged from 2Q 2026 and 3Q 2025

    United States - 39%


    What the index measures: the share of households earning enough to buy the median-priced existing single-family home, at a payment covering principal, interest, taxes and insurance. Statewide that was $5,700 a month on an $894,630 home, assuming an effective 30-year fixed rate of 6.80% - up from 6.54% in the second quarter.


    So the rate assumption got worse and the regional numbers still moved up a little. C.A.R.''s own headline says affordability held steady "as lower home prices offset higher mortgage rates."


    One more number worth keeping: 31% of California households could afford the $640,000 median-priced condo or townhome, up from 30%. Same state, different door.


    Source: California Association of REALTORS, 3rd Quarter 2026 Housing Affordability, released Oct 30, 2026.


