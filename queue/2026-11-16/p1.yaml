    #LongBeachRealEstate #SouthBayHomes #LakewoodCA #TorranceCA #CerritosCA #SoCalRealEstate'
  linkedin: 'California''s housing affordability index was flat in the third quarter of 2026 - 19% of households could afford the median-priced existing single-family home, unchanged from both the prior quarter and a year earlier. The regional picture underneath it moved.


    C.A.R.''s 3Q 2026 release, dated Oct 30, 2026: Los Angeles metro area 18%, up from 16% in 3Q 2025. Inland Empire 26%, up from 23%. United States 39%. Statewide, the index assumes a $5,700 monthly payment including taxes and insurance on an $894,630 median price, at an effective 30-year fixed rate of 6.80% - up from 6.54% in 2Q 2026.


    That combination is the part worth sitting with. The rate assumption rose and two Southern California regions still improved, which C.A.R. attributes to lower home prices offsetting higher borrowing costs. Affordability is a ratio, and the denominator has been doing more work than the headline rate.


    The practical takeaway for anyone advising buyers or sellers: a statewide index describes a median household buying a median home, and almost nobody is both. It is useful as a direction, not as a qualification.


    Source: California Association of REALTORS, 3rd Quarter 2026 Housing Affordability, Oct 30, 2026.


    For those tracking this quarterly - which input are you watching more closely into 2027, price or rate?


