  facebook: 'If you run a team, you already know the math gets messy fast. Per-agent splits, caps, monthly fees, your own production, the overhead you carry.


    I added a team calculator to my agent site. Enter your team''s numbers and what you pay now, choose the Epique team type that fits (Traditional, Family or Power), and it estimates what the team would keep each year by comparison.


