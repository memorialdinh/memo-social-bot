captions:
  default: 'Everyone is in one room today. That makes three questions easier than they will ever be over the phone in January.


    Ask them gently, and ask them once.


    Where is the grant deed, and whose name is actually on it? Not where people think it is. Where it is.


    Is the house in a trust, or is it not? Those are two different sets of paperwork later.


    Who is the successor trustee? Someone is, or someone will have to be appointed.


    That is the whole conversation. Five minutes, no decisions, nothing signed. You are not planning anything today - you are finding out what already exists, so nobody is guessing under pressure later.


    And if the answer to any of the three is "I don''t know", that is useful too. It just means the next call is to an estate attorney, not to me.


    DM me ''SELLER'' and I''ll send the three questions written out, so you don''t have to be the one who brings up paperwork at dinner.


    #LongBeachRealEstate #LakewoodHomes #CerritosCA #TorranceHomes #SouthBayHomes #SoCalRealEstate'
  linkedin: 'The one day a year the whole family is in one room is also the easiest day to find out where the paperwork is.


    Three questions, none of which require a decision: where the grant deed is and whose name is on it, whether the house sits in a trust, and who the successor trustee is. Nothing gets planned, nothing gets signed.


    I have sat with enough families after the fact to know the difference between the ones who knew those answers and the ones who were finding out while grieving. The information is identical. The pressure is not.


    If any answer is "I don''t know", the next call is to an estate attorney rather than an agent. General information, not legal or tax advice.


    What is the one question you wish more families asked earlier?


    #RealEstate #EstatePlanning #CaliforniaRealEstate'
