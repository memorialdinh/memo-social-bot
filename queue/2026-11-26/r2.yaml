captions:
  default: 'Not selling. Not refinancing. Not planning anything. Just: do you know where these four are?


    The grant deed. The title insurance policy from when you bought. The declaration page of your homeowners
    policy. Your current mortgage statement.


    Four documents, one folder. That is the entire job.


    Here is why it is worth an hour this weekend. Every one of those gets asked for at the moment you
    are least able to go looking - a claim, a refinance, an insurer wanting to know what your coverage
    actually says, a death in the family.


    None of them are hard to replace. All of them are annoying to replace. The deed is recorded with the
    county, so a copy exists. The title policy came from the title company at closing. The declaration
    page arrives at every renewal. The statement shows up monthly.


    Pull them into one place while nothing is happening. That is the whole point of doing it today.


    Comment ''SELLER'' and I''ll send the one-page list I give my own clients after closing.


    #LongBeachRealEstate #LakewoodHomes #CerritosCA #SouthBayHomes #TorranceHomes #SoCalRealEstate'
