captions:
  instagram: 'Buying a condo or anything with an HOA? Read these four 📑


    1. The CC and Rs, bylaws and rules. Rentals, pets, what you can park, whether you can change your windows. This is the actual rulebook you''re agreeing to.


    2. The budget and the reserve study. The reserve is what pays for the roof, the elevator, the pipes. A thin reserve on an older building is how a special assessment finds you.


    3. Recent board meeting minutes. Honestly the most useful document in the pile. You''ll see what''s breaking and what they''re arguing about.


    4. The statement of what''s owed. Current dues, anything unpaid on the unit, any pending special assessment, any litigation.


    And know what your dues even cover — usually insurance on the common areas, maintenance of shared spaces, management, and that reserve contribution. Not your interior.


    You should receive an HOA document package in a California sale. If it hasn''t shown up, ask for it in writing, and don''t release that contingency until you''ve actually read it.


    DM me BUYER and I''ll send the checklist 👇


    #CondoBuying #HOA #FirstTimeHomeBuyer #LongBeachRealEstate #SouthBayHomes #BuyerTips'
  facebook: 'The HOA document package is the most-ignored stack of paper in a condo purchase, and it''s the one that costs people money later.


    Here''s what''s in it that matters, and what dues actually buy you.


    What your dues generally cover: insurance on the common areas, maintenance and utilities for the shared spaces, management, and a contribution to reserves. What they generally don''t cover: anything inside your walls. Your interior is yours.


    Now the four documents worth your evening.


    The CC and Rs, bylaws and rules. The real rulebook. Whether you can rent the unit out and for how long, pet limits, parking, what you''re allowed to change on the exterior or the windows. People find out about rental restrictions after they''ve bought and planned to rent. Read it first.


    The budget and the reserve study. This is the one most buyers skip and shouldn''t. Reserves are the savings account for big replacements — roof, elevator, plumbing, paving. The reserve study estimates what those will cost and when. A building with aging systems and a thin reserve is a building where a special assessment is a question of when, not if.


    Recent board meeting minutes. My favourite document in the pile, because nobody writes minutes to impress a buyer. You''ll see what keeps breaking, what owners are frustrated about, and what the board is putting off.


    The statement of assessments and disclosures. Current regular dues, any amount unpaid on that specific unit, any special assessment already approved or being considered, and any litigation the association is involved in.


    In a California sale you should receive this package. If it hasn''t arrived, ask for it in writing — and don''t release your HOA contingency until you''ve read it. An HOA is a small government you''re buying into. Thirty minutes of reading is a reasonable price for knowing which one.


    General information, not legal advice. Your contract governs the timelines.


    DM me BUYER and I''ll send you the checklist I use.


    Anyone been surprised by a special assessment? What was it for?


    #CondoBuying #HOA #LongBeachRealEstate'
  linkedin: 'The HOA disclosure package is routinely under-read, and it contains the clearest available signal about a property''s future costs.


    What dues typically fund: common-area insurance, maintenance and utilities for shared spaces, management, and reserve contributions. Not the unit interior.


    Four documents that deserve genuine attention before a contingency is released.


    Governing documents — CC and Rs, bylaws, rules. These establish rental restrictions, pet and parking limits, and architectural control. Rental restrictions in particular have derailed investment theses that were formed before anyone read the document.


    Budget and reserve study. Reserves fund major component replacement. A reserve study pairs expected remaining useful life against funded balance. An association with aging components and an underfunded reserve carries a special-assessment risk that the monthly dues figure alone will not reveal.


    Board meeting minutes. The least curated document available and often the most informative — recurring maintenance failures and deferred decisions show up here first.


    Assessment and disclosure statement — current dues, amounts unpaid on the specific unit, approved or contemplated special assessments, and pending litigation.


    Buyers in California should receive this package during the transaction; if it has not arrived, request it in writing, and treat the contingency release as the deadline for having read it rather than a formality.


    General information only, not legal advice.


    #RealEstate #HomeBuying #DueDiligence'
