  facebook: '"So we accepted an offer — now what?"


    Most sellers have no map for the next 30 days, which is why the quiet weeks feel alarming. Here''s the shape of a typical California escrow.


    Week one. Escrow opens. The buyer''s good faith deposit goes to the escrow holder, who is a neutral third party. It does not come to you, and that surprises people every time. Your disclosure package goes out to the buyer, and title starts its search for anything recorded against the property.


    Week two. The buyer does their inspections — general, and often roof, sewer or termite depending on the house. The lender orders the appraisal. This is the week you may need to be out of the house a few times, and the week the questions start.


    Week three. The loan is in underwriting. If the inspection turned up items, the repair request conversation happens here, and it''s a negotiation, not a demand. As each piece clears, the buyer releases that contingency in writing. This is the week the deal actually becomes solid.


    Week four. Loan documents go to escrow, the buyer signs, their lender funds, and the deed records with the county. Recording is the moment it''s sold. Not signing — recording.


    A few honest caveats. Thirty days is a common target, not a rule; your contract sets the actual timelines and they can be shorter or considerably longer. Cash closes faster. Anything unexpected in title or the appraisal can stretch it.


    But if you know the four phases, you stop panicking in week two when nothing appears to be happening. Underwriting is slow on purpose.


