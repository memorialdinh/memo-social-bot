  kicker: FOR AGENTS
  headline: The split isn't the *whole* number.
  myth: A lower split means I keep more of my money.
  fact: What counts toward the cap, when your cap year resets, and what you still pay after you cap can matter more than the split itself. Ask all three in writing.
  cta: DM 'MATH' for the question list
captions:
  instagram: 'Agents, before you move anywhere, ask these three about the cap 📋


    One. What actually counts toward it? Some plans count only your commission split. Others let franchise fees, transaction fees or team production count. Very different finish lines.


    Two. When does your cap year reset? Anniversary of your start date, or January 1? If you join in October on a calendar reset, you could be weeks from starting over.


    Three. What do you pay after you cap? There is almost always something. Find out the number before you need it, not in month nine.


    None of this is about who is cheapest. It''s about knowing what you signed.


    DM me MATH and I''ll send you the full list of questions to ask whoever you''re talking to, mine included.


    #RealEstateAgent #RealtorLife #RealEstateCareer #AgentTips #BrokerageQuestions'
  facebook: 'If you''re thinking about changing brokerages, the split is the number everyone quotes and the one that tells you the least.


    The cap is where the real money is, and almost nobody asks about it properly. Three questions.


    First: what counts toward the cap? This varies more than you''d think. At some brokerages only your commission split credits toward it. At others, franchise fees, per-transaction fees or production from your team count too. Same cap number on paper, completely different distance to reach it.


    Second: when does your cap year reset? If it runs from your start date, you get a clean twelve months. If it resets January 1 for everyone, and you''re joining in the fall, you may hit the new year with your progress wiped. Not a dealbreaker, but you want to know it before you sign, not after.


    Third: what are you paying once you''ve capped? There''s usually still something. A transaction fee, a tech fee, E and O. Ask for the actual dollar figure on a capped agent''s closing.


    Then one follow-up that covers all three: can I see this in writing?


    I''m not telling you where to go. Plenty of good agents are happy where they are, and that''s a fine answer. But "I have a great split" is not the same as knowing what your year actually costs you, and the only way to find out is to ask specifically.


    DM me MATH and I''ll send you the list I''d want someone to use on me.


    What''s a question you wish you''d asked before your last move?


    #RealEstateAgent #RealtorLife #RealEstateCareer'
  linkedin: 'Most conversations about changing brokerages start with the commission split. It is the least informative number in the agreement.


    The cap structure is where the economics actually sit, and it has three variables that rarely get examined.


    What counts toward the cap. In some plans only the commission split credits toward it; in others franchise fees, per-transaction charges or team production count as well. Two brokerages can advertise an identical cap and require substantially different volume to reach it.


    When the cap year resets. An anniversary-date reset gives a full twelve months from the day you join. A calendar-year reset does not, and an agent joining in the fourth quarter should know that before signing rather than after.


    What you pay post-cap. There is nearly always a residual — transaction fees, technology, E and O. The figure to ask for is the actual cost on a capped agent''s closing statement, not the policy description.


    The close for all three: ask for it in writing. Any brokerage worth joining will put it there without friction, and the response itself is information.


    Revenue share and equity programs are worth asking about separately and are subject to current plan terms and eligibility.


    I''d add that staying put is a legitimate outcome of this exercise. The goal is an informed decision, not a move.


    Which of the three gets skipped most often, in your experience?


    #RealEstate #RealEstateAgents #CareerDevelopment'
