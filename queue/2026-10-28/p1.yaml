captions:
  instagram: '"Sales are down 9%, so homes must be getting cheaper."


    They aren''t. Not here, not yet.


    Southern California closed sales in September were down 9.1% from a year ago, the biggest annual drop of any region in the state. Statewide, 260,410 on an annualized basis, down 6.5%.


    And prices? Up. SoCal regional prices finished 3.0% above last September. The statewide median was up 1.7%, the fifth month in a row of annual gains.


    Volume and price are two different signals. Fewer people closing does not automatically mean sellers are cutting. It can just as easily mean fewer people are listing.


    So read the headline, then read the second number.


    Comment VALUE and I''ll run what your place is actually worth right now 👇


    Figures: C.A.R. September 2026 report, released Oct 19. Estimates, not an appraisal.


    #SoCalRealEstate #LongBeachRealEstate #SouthBayHomes #HousingMarket #LakewoodCA #TorranceHomes'
  facebook: 'Every time a sales number drops, my inbox fills up with the same theory: prices must be next.


    September''s data says otherwise, and it''s worth sitting with for a second.


    Southern California closed sales were down 9.1% compared to September of last year. That''s the largest annual decline of any region in California. Statewide, sales ran at 260,410 on a seasonally adjusted annual basis, down 6.5% year over year, and that''s now the 48th straight month under 300,000.


    That is a genuinely slower market. Fewer transactions, fewer closings, more time on the table.


    Now the other half. Regional prices in Southern California finished 3.0% above last September. The statewide median came in at $899,720, up 1.7% from a year ago, and that was the fifth consecutive month of annual gains.


    Sales volume down. Prices up. Both true at once.


    Here''s why that isn''t a contradiction. Sales volume counts how many people transacted. Price measures what the ones who did transact agreed to. When fewer homes get listed in the first place, you get exactly this: not much trading, and not much discounting either.


    What it means practically. If you''re buying, don''t walk in expecting a sale just because you read a scary headline. If you''re selling, a slow market is not the same as a falling one, but it does mean your pricing has to be right on the first try.


    Numbers are from C.A.R.''s September 2026 report, released October 19. I''m describing what happened, not calling where anything goes next.


    Which number would you rather have on your side, volume or price?


    #SoCalRealEstate #HousingMarket #LongBeachRealEstate'
  linkedin: 'A useful reminder from September''s California data: transaction volume and price level are separate measurements, and right now they are pointing in opposite directions.


    Southern California closed sales were down 9.1% year over year, the largest annual decline of any region in the state. Statewide sales ran at 260,410 SAAR, down 6.5%, the 48th consecutive month below 300,000.


    Over the same period, Southern California prices were up 3.0% year over year, and the statewide median of $899,720 was up 1.7% — a fifth straight month of annual gains.


    The instinct is to read a volume decline as a leading indicator of price. Sometimes it is. But a volume decline driven by constrained supply looks very different from one driven by absent demand, and the price line is what distinguishes them. When fewer owners list, fewer transactions and firm pricing coexist comfortably.


    The practical takeaway for anyone advising clients: quote both numbers. A buyer told only that sales fell 9% will expect discounts that are not in the data. A seller told only that prices rose 3% will expect a quick sale that the volume figure does not support.


    Figures from the California Association of REALTORS® September 2026 report, released October 19, 2026. Descriptive, not a forecast.


    How are you framing this split for your own clients?


