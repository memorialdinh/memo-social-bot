captions:
  default: 'The inspection came back and the buyer sent a list. This is the part where sellers panic and overpay.


    Here''s the order that keeps it calm.


    1. Read the report before you read the request. The ask is someone''s interpretation of the findings. Go to the findings. Half the time the scary line item is a cheap fix described in alarming language.


    2. Price it before you answer. One contractor number on the two or three real items. Sellers who negotiate off a feeling hand over a credit that''s double what the work costs, and they never find out.


    3. Pick your lane. You can repair it, credit it, reduce the price, or decline. Those are four different things and they land differently — on your net, on the buyer''s loan, and on how much of escrow you spend coordinating trades. A credit is usually cleaner than a repair you have to schedule around a closing date.


    4. Answer in writing, inside the window your contract gives you. That window is real. Not answering is still an answer, it''s just one you didn''t pick.


    The thing nobody says out loud: a repair request is not a renegotiation of the price. It''s a response to information. Treat it that way and it stays small.


    Which forms and timelines apply depends on your contract — your broker and your own attorney confirm that. General information, not legal advice.


    Comment ''SELLER'' and I''ll send the checklist I actually work from.


