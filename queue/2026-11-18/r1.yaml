  linkedin: 'The request for repairs is where a calm listing turns expensive, and almost always for the same reason: the seller negotiates off the request instead of off the report.


    A workable sequence.


    Read the findings first. The request is an interpretation of the inspection, not the inspection. Separating the two usually shrinks the list.


    Price the real items before responding. A seller without a contractor number is negotiating against an unknown, and the credit that results is routinely larger than the cost of the work.


    Then choose the instrument deliberately. Repair, credit, price reduction and decline are four different outcomes with different effects on net proceeds, on the buyer''s financing, and on how much of escrow gets spent coordinating trades around a closing date. A credit is frequently the cleaner path; it is not automatically the cheaper one.


    Respond in writing inside the contractual window. Non-response is a position, and not usually the intended one.


    The framing that holds all of it together: a repair request is a response to information, not a reopening of price. Sellers who hold that line concede less and close on time more often.


    Which forms and timelines apply depends on the contract, and that is a question for the broker and the seller''s own counsel. General information, not legal advice.


    What is the most common item you see sellers overpay to resolve?


