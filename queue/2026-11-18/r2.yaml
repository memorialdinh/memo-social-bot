captions:
  default: 'Your loan was approved. It can still be un-approved. Five things not to do between acceptance and keys.


    Check yours:


    1. No new credit. Not a card, not a car, not the interest-free furniture financing for the house you haven''t closed on. Lenders re-pull credit before funding, and new debt changes the ratio the approval was built on.


    2. No job change. New employer, new title, hourly to commission, salary to 1099 — all of it restarts income verification. If a change is coming anyway, tell your lender before it happens, not after.


    3. No large unexplained deposits. Money has to be sourced. A large transfer with no paper trail behind it stops a file cold, and "it''s mine" is not sourcing.


    4. Don''t cancel or downgrade the insurance quote. The lender requires coverage to fund. Shopping it is fine. Letting it lapse while you shop is not.


    5. Don''t co-sign for anyone. Someone else''s loan on your credit is your debt as far as underwriting is concerned.


    None of these are rare. Every one of them is something I''ve watched happen in the last stretch of escrow, usually with the best intentions.


    The rule underneath all five: between acceptance and closing, your financial picture should be boring. Change nothing you don''t have to.


    General information, not lending advice — your lender has the final word on your file.


    DM me ''BUYER'' if you checked one of these and want to know whether it matters.


    #LongBeachRealEstate #LakewoodHomes #SouthBayHomes #CerritosHomes #FirstTimeHomeBuyer #HomeBuyingTips #OrangeCountyRealEstate'
  linkedin: 'Approval is not funding, and the gap between them is where otherwise clean files fall apart. Five changes that do it, all of them avoidable.


    New credit. Lenders re-pull before funding. A financed furniture package or a car payment alters the debt ratio the approval was underwritten on.


    Employment or compensation changes. New employer, new title, hourly to commission, W-2 to 1099 — each restarts income verification. A buyer who tells the lender in advance usually keeps the file intact; one who mentions it afterwards often does not.


    Unsourced deposits. Funds have to be documented. A large transfer without a trail stalls underwriting regardless of whose money it is.


    Insurance lapses. Coverage is a funding condition. Shopping the policy is fine; letting it lapse mid-shop is not.


    Co-signing. Another borrower''s obligation sits on the buyer''s credit and underwrites as the buyer''s debt.


    The operating rule for buyers in escrow: keep the financial picture boring. Every one of the five above is something a buyer does for a sensible reason, which is exactly why it keeps happening.


    General information, not lending advice; the lender decides on the file.


    Agents and lenders — which of the five do you catch most often, and how late?


    #RealEstate #Mortgage #HomeBuying'
