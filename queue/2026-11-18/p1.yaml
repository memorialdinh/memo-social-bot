captions:
  default: 'You closed. Now there''s a folder of paper nobody walked you through.


    It''s worth keeping. Four things to do with it this week:


    1. Save the final Closing Disclosure. It''s the line-by-line record of every dollar that moved at closing — what you paid, what the seller paid, what the lender charged. If a question ever comes up about any of it, that''s the document that answers it.


    2. File the grant deed and the owner''s title policy somewhere you''ll actually find them. Not the moving box. The deed is your ownership record. The title policy is coverage you already paid for and will never think about again until you need it.


    3. Start a receipts folder for improvements. New roof, new HVAC, the bathroom you redo in year three. Those are capital improvements, and the paper trail matters the year you sell — not the year you spend it.


    4. Scan all of it once and put it somewhere that isn''t your phone. Five minutes now, versus an afternoon of drawers later.


    I''m not a CPA and none of this is tax advice. It''s just what past clients call me about two or three years in, and that call gets a lot shorter when the folder exists.


    Speaking of past clients: I keep a Birthday Club for people I''ve worked with. No pitch, no newsletter. DM me ''BDAY'' and I''ll add you.


