captions:
  instagram: 'Most people walk into this with a feeling instead of a number.


    "Around six thousand a month, maybe." "Probably sixty for the down payment." "I''d like to be out by summer."


    Feelings don''t survive a negotiation. Numbers do.


    The most comfortable buyers and sellers I work with aren''t the richest ones. They''re the ones who wrote down the monthly payment they''re actually willing to carry, the cash they''ll part with, and the date they need to be moved — before anyone asked them to decide anything.


    Once it''s written, it''s a line. Until it''s written, it''s a mood, and moods move at 9pm on a Sunday when you''re looking at photos.


    You don''t need to be ready. You need to know your numbers.


    DM me ''BUYER'' and we''ll put yours on paper.


    #HomeBuyingTips #FirstTimeHomeBuyer #RealEstateTips #LongBeachRealEstate #SouthBayHomes #SoCalRealEstate'
  facebook: 'A pattern I''ve noticed, and it has nothing to do with how much money someone has.


    The calmest people in a transaction are the ones who wrote their numbers down before they needed them.


    Not "around six grand a month." The actual monthly payment they are willing to carry, after they looked at what else that money does in their life. Not "sixty-ish for the down payment." The cash amount they will part with, and what they''re keeping in reserve. Not "sometime next summer." A date.


    Here''s why it matters more than it sounds like it should. A negotiation is a sequence of small moments where someone asks you to move. Fifteen thousand more. Cover this repair. Close two weeks earlier. If your limit lives as a feeling, every one of those moments is a fresh decision made under pressure, usually at night, usually while looking at photos of a house you already like.


    If your limit is written down, it''s a line. You either hold it or you consciously change it, and both of those are fine. What''s not fine is discovering your limit by crossing it.


    This is also the honest version of "am I ready?" You don''t have to feel ready. You have to know your numbers. Sometimes writing them down tells you to wait a year, and that''s a real answer, not a failure.


    What''s the one number you''ve been avoiding writing down?


    #HomeBuyingTips #FirstTimeHomeBuyer'
  linkedin: 'An observation from the negotiating side of residential transactions.


    The clients who hold their position best are not the ones with the most capital. They are the ones who committed their constraints to writing before they were tested: the monthly payment they will actually carry, the cash they will part with, the reserve they will not touch, and the date they need.


    The mechanism is straightforward. A negotiation presents a series of incremental requests to move, each one small relative to the whole and each one arriving under time pressure. A constraint held as an impression is re-decided at every request. A constraint committed to writing is either held or deliberately revised — and the deliberate revision is a decision rather than a drift.


    This is also the more useful framing of readiness. Readiness is not a feeling to wait for; it is a set of figures a person can state. Writing them down sometimes produces the answer "not this year," which is a legitimate outcome and a considerably better one than discovering a limit by exceeding it.


    The takeaway for advisors: get the numbers written before the first offer, not during it.


    For the agents and lenders here — at what point do you make clients commit their numbers to paper?


    #RealEstate #HomeBuying #Negotiation'
  tiktok: 'Write down the payment, the cash and the date before you shop. A limit in your head isn''t a limit.


