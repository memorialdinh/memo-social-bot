  facebook: |-
    Here's why I don't answer "how's the market?" with one number anymore.

    Active listings in September 2026, measured against the same month a year earlier, across cities I work in:

    Cypress, up 19.1%. Gardena, up 11.0%. Redondo Beach, down 9.0%.

    That's a 28-point spread between the top and the bottom, in one region, in one month.

    What it means in a real conversation: inventory is the rough measure of how much choice a buyer has, and therefore how much leverage. Where listings are up meaningfully, a buyer has more to compare and usually more room to ask — for a repair, a credit, a longer escrow. Where listings are down, that room is thinner, and a seller can hold a line more comfortably.

    What it does not mean: anything about where this goes next. It's one month against one month. A year-over-year change describes what happened, not what's coming, and anyone telling you otherwise is guessing.

    The practical version: ask about your city, and really about your price band inside your city. A regional average is a number that describes nowhere.

    Figures: Realtor.com monthly ZIP-level inventory, September 2026.

    Comment VALUE and I'll look up where your city landed.

