captions:
  default: 'Live in one unit. Rent the rest.


    That''s house hacking, and it starts long before you tour a duplex.

    Talk to a lender first. Confirm every unit is legal. Then run the numbers with real rents and real expenses, not the listing''s projections.


    DM me ''INVEST'' and I''ll send you my house-hack worksheet.


    #LongBeachRealEstate #LakewoodCA #SouthBayHomes #HouseHacking #DuplexLiving #LongBeachHomes #RealEstateInvesting'
  linkedin: 'House hacking gets pitched as the easy way into real estate investing. The order of operations is what makes it work.


    Start with the lender, so you know which owner-occupied loans fit and how rental income from the other units is counted. Verify every unit against permits and city records before writing an offer. Then underwrite with market rents, taxes, insurance, repairs and vacancy, not the listing''s projections.


    The takeaway: a 2-4 unit purchase is underwritten like a small investment, even when you live in it.


    Which of these steps do buyers most often skip?


    #RealEstate #RealEstateInvesting #HousingMarket'
