captions:
  default: 'Missed this morning''s carousel? Here''s house hacking on one page.


    Buy a 2-4 unit home, live in one unit, and let the rent from the others help cover the mortgage. It works when you do it in order:


    1. Lender first, so you know what loan fits and how the rents count.

    2. Make sure every unit is legal before you fall in love with it.

    3. Run the numbers with real rents and real expenses.

    4. Then write the offer.


    DM me ''INVEST'' and I''ll send you my house-hack worksheet.


    #LongBeachRealEstate #LakewoodCA #SouthBayHomes #HouseHacking #DuplexLiving #FirstTimeHomeBuyer #RealEstateInvesting'
  linkedin: 'One more look at house hacking, because the sequence is where most buyers go wrong.


    Lender before property: owner-occupied financing and the way rental income is counted decide what you can buy. Legality before an offer: every unit should be confirmed against permits and city records. Underwriting before emotion: market rents, taxes, insurance, repairs and vacancy, not the listing''s pro forma.


    A small multifamily purchase is still an investment, even when you live in it.


    If you''re weighing a duplex or fourplex in Long Beach or the South Bay, message me and I''ll share the worksheet I use with buyers.


    #RealEstate #HouseHacking #RealEstateInvesting'
