  facebook: |-
    Here's a number that surprises people who've lived here their whole lives.

    In September 2026, typical asking rent across the cities I work ran from about $2,334 at the low end, in Gardena, to about $3,401 at the high end, in Lakewood. Both are Los Angeles County. They're a short drive apart. That's roughly $1,067 a month of difference.

    Two reasons that's worth knowing.

    If you're thinking about buying, rent is your baseline. Every "should I buy or keep renting" conversation is really a comparison between a rent number and a total monthly housing payment. People almost always run that math against a countywide rent figure, or against what they personally happen to pay, and both of those produce an answer about a city they don't live in.

    If you're looking at a small rental property, this is the reminder that rent and purchase price are two separate markets. They don't rise and fall in lockstep, and the relationship between them is different in each city. A property that pencils in one of these cities doesn't automatically pencil ten minutes away.

    About the numbers: these are Zillow's Observed Rent Index, a smoothed index of typical asking rent for September 2026. They're estimates of a typical figure, not appraisals, and not a quote on any particular unit. Nothing here says where rents go next.

    Curious which city surprises you most on that list?

    #SoCalRealEstate #RealEstateInvesting
  linkedin: |-
    A reminder that "the rental market" is not a unit of analysis.

    Across the cities I work in Los Angeles County, typical asking rent in September 2026 ranged from approximately $2,334 to approximately $3,401 — roughly $1,067 a month of spread between two cities a short drive apart. Source: Zillow Observed Rent Index, September 2026, a smoothed index of typical asking rent.

    Two decisions turn on getting this right.

    For a prospective owner-occupant, rent is the comparison baseline in any rent-versus-own analysis. Substituting a countywide rent figure for a submarket figure can move that comparison by more than a thousand dollars a month, which is usually larger than the difference the analysis was trying to detect.

    For a small-scale investor, it is evidence that rents and values are distinct series with distinct local behavior. Gross yield is therefore a city-level question before it is a property-level one, and a model calibrated in one submarket does not transfer to the next one over.

    These are index estimates of a typical figure, not appraisals, and not a projection of where rents go next.

    For the investors here — at what geography do you calibrate your rent assumptions?

