  facebook: |-
    A parent, a grandparent or a sibling is helping with your down payment. That's a wonderful thing, and it is also a document problem until you treat it like one.

    Here's what generally has to be true before a lender will count that money.

    First, who it's from. Loan programs have their own rules about which relationships qualify as an acceptable donor. Ask before the money moves, not after.

    Second, a gift letter. Signed, naming the amount, naming the donor, and stating plainly that no repayment is expected. Your lender has a form. Use theirs.

    Third, it has to actually be a gift. If there's a side agreement, a text thread about paying it back, or a repayment schedule anywhere, it's a loan, and it changes your debt picture.

    Fourth, the paper trail. Underwriting wants to see where the money was before it moved and the transfer itself — the donor's statement, the wire or the cleared check. This is where most files stall: money that showed up as a cash deposit weeks ago, with nothing to show where it came from.

    One practical tip that saves a week: do not let anyone hand you cash. A traceable transfer, into the account you're using for the purchase, with the statement showing both sides.

    General information, not lending advice — your loan officer's program rules are the ones that govern.

    Anyone had a gift-fund surprise in underwriting? What tripped it up?

