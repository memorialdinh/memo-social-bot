  linkedin: |-
    Gift funds are one of the most common sources of down payment assistance in a family, and one of the most common causes of a late-stage underwriting delay.

    What generally has to be established before gifted funds count toward a down payment:

    Donor eligibility. Loan programs define which relationships qualify, and the answer is program-specific rather than universal.

    A signed gift letter. Donor, amount, and an explicit statement that no repayment is expected.

    Confirmation that no repayment obligation exists. Any side agreement converts the gift into a liability and changes the borrower's debt profile.

    A documented transfer path. The donor's account, the transfer instrument, and the receipt into the borrower's account.

    The failure mode is almost always the fourth item, and it is usually created months earlier by an untraceable cash deposit. The practical advice is simply to sequence it: confirm donor eligibility with the loan officer, then transfer, then document — never the reverse.

    General information, not lending advice.

    For the lenders here — what's the most common gift-fund documentation gap you see?

