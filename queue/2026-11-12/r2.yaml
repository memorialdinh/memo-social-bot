  instagram: |-
    Someone's helping with your down payment. Beautiful. Now it has to survive underwriting.

    Four things a lender generally wants before gift money counts:

    Who it's from. The relationship matters, and programs differ on who qualifies.

    A signed gift letter. Stating it's a gift, naming the amount, and saying there's nothing to repay.

    Proof it's not a loan. If repayment is expected anywhere in writing, it isn't a gift.

    A paper trail. Where the money sat before it moved, and the transfer itself.

    The part that trips people up: cash deposited into your account weeks earlier, with no trail. That's the one that stalls a file.

