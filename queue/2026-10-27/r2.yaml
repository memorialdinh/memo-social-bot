captions:
  instagram: 'In September, 184 of the 488 active Long Beach listings had cut their price. That is 37.7%.


    A few miles up the 605, Lakewood was 21.7%.


    Same county. Same month. Very different rooms to negotiate in.


    A price cut is not a distress signal. Usually it means the first number was a guess and the market answered.


    What it tells a buyer: ask how long it has been listed and whether the price has moved. That is public.


    What it tells a seller: your first two weeks are the ones that count.


    Redondo Beach 42.5%, Gardena 35.8%, Torrance 34.3%, for the rest of the map.


    DM me VALUE for an estimate on yours 👇


    Realtor.com residential data, Sept 2026. Lakewood had 46 active listings, so read that one loosely. An estimate, not an appraisal.


    #LongBeachRealEstate #SouthBayHomes #LakewoodCA #TorranceCA #RedondoBeach #MarketUpdate'
  facebook: 'Here is a local number I had not seen laid out city by city before.


    In September, 37.7% of active listings in Long Beach had taken a price reduction. That is 184 homes out of 488 across the city''s ZIP codes.


    Now the neighbors, same month, same source:


    Redondo Beach 42.5%. Gardena 35.8%. Torrance 34.3%. Lakewood 21.7%.


    Lakewood is the one that stands out, and it is worth saying that it had only 46 active listings in the count, so a handful of homes swings that percentage a lot. Long Beach, with 488, is the sturdier figure.


    What a price reduction actually means. Not that a seller is desperate, and not that a home has a problem. Most of the time it means the opening price was set optimistically and the first few weeks of showings said otherwise. Every seller gets one honest shot at a fresh audience, and that happens in roughly the first two weeks.


    If you are buying, this is usable. Days on market and price history are public. A home that has been sitting for six weeks with one cut behind it is a different conversation than one listed Thursday.


    If you are selling, the lesson is about the opening number, not about cutting. The cut is what happens after the first number missed.


    I am describing September, not predicting anything about the rest of the year.


    Want to know where your own home sits in this? Comment VALUE and I will put an estimate together. An estimate, not an appraisal.


    Source: Realtor.com residential data by ZIP code, September 2026.


    #LongBeachRealEstate #SouthBayHomes #LakewoodCA'
  linkedin: 'A useful reminder that "the market" is not one market, even inside a single county.


    Share of active listings carrying a price reduction, September 2026, by city:


    Redondo Beach 42.5%. Long Beach 37.7% (184 of 488 active). Gardena 35.8%. Torrance 34.3%. Lakewood 21.7%.


    A caveat on the spread: Lakewood''s figure rests on 46 active listings, so it is volatile. Long Beach''s rests on 488 across eight ZIP codes and is the more reliable of the two.


    What the metric captures is the gap between seller expectations at listing and what buyers responded to, aggregated. A high reduction share in a given month says more about how aggressively homes were priced going in than about underlying demand, which is why it can diverge sharply between adjacent cities with similar fundamentals.


    The practical use is in pricing conversations. The first two weeks on market are the only ones with a fresh audience, and a reduction share near 40% is a reasonable argument for pricing into the market rather than above it and correcting later.


    This describes September 2026 data and is not a forecast.


    Source: Realtor.com residential data by ZIP code, September 2026.


    #RealEstate #HousingMarket #LosAngeles'
