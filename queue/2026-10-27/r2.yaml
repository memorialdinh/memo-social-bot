captions:
  instagram: 'Two local numbers that sound like they disagree.


    LA Metro median: $855,000 in September, up 3.0% from a year ago.


    Southern California sales: down 9.1% from a year ago. The steepest annual drop of any region in the state.


    So prices edged up while roughly one in eleven sales disappeared.


    That is not a crash and it is not a boom. It is a market where fewer people are moving. Sellers with low locked-in rates are staying put, so there is less to choose from, and the homes that do sell are not sitting there getting cheaper.


    If you live here, what it means day to day: less competition at the open house, less selection too.


    Curious what yours would do right now? DM me VALUE 👇


    C.A.R. September 2026 data, released Oct 19, 2026. An estimate, not an appraisal.


    #LongBeachRealEstate #SouthBayHomes #LAHousingMarket #LakewoodCA #TorranceCA #MarketUpdate'
  facebook: 'Two numbers worth sitting with if you own a home around here.


    In September, the median price for an existing single-family home in the LA Metro Area was $855,000. That is up from $850,000 in August and $830,000 in September of last year, so about 3.0% over twelve months.


    Across Southern California as a whole, the median was $895,000, also up about 3.0% year over year.


    Now the other side. Southern California sales were down 9.1% from a year ago. That is the largest annual sales decline of any region in California. LA Metro was down 8.0%.


    Prices up a little, volume down a lot.


    The way I read it: this is a supply story more than a demand story. Plenty of owners are sitting on mortgages they will not willingly trade, so they are not listing. Fewer listings means fewer sales, and it also means the homes that come up are not piling up unsold and cutting price.


    What it feels like in practice. As a buyer, less competition than 2021 and a lot less selection. As a seller, fewer buyers coming through, but the ones who do are serious and pricing has held.


    I am describing what happened through September, not calling what happens next. Anyone who tells you they know is selling something.


    If you want to know where your specific home sits, comment VALUE and I will put an estimate together. An estimate, not an appraisal.


    Source: California Association of REALTORS, September 2026 report released October 19, 2026.


    #LongBeachRealEstate #LAHousingMarket #SouthBayHomes'
  linkedin: 'The September C.A.R. data makes the Southern California picture unusually clear.


    LA Metro Area median price for existing single-family homes: $855,000, up 0.6% from August and 3.0% year over year. Southern California overall: $895,000, up 3.0% year over year.


    Sales tell a different story. Southern California transactions were down 9.1% year over year, the largest annual decline of any California region. LA Metro was down 8.0%, despite being up 1.5% month over month.


    Appreciation of roughly 3% alongside a near-10% contraction in volume is the signature of constrained supply rather than soft demand. C.A.R.''s own commentary attributes it to the rate lock-in effect limiting new listings, with that same limited inventory cushioning prices against weaker demand.


    The implication for anyone advising clients locally: the pricing conversation and the liquidity conversation have separated. A seller can reasonably expect the price to hold and should still plan for a thinner buyer pool and a longer search on the purchase side.


    This describes data through September 2026 and is not a forecast.


    Source: California Association of REALTORS, released October 19, 2026.


    #RealEstate #HousingMarket #LosAngeles'
