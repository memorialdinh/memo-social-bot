captions:
  instagram: 'Cap rate says 4.4%. Cash-on-cash says negative 6.7%. Same property.


    Cap rate pretends you paid cash. Cash-on-cash is the one that knows you have a loan.


    One example. $900,000 two-unit, $2,700 a unit, 5% vacancy, $22,000 a year in expenses:


    NOI $39,560. Divide by price, that is your 4.4% cap rate.


    Now add the loan. 25% down, $675,000 at 7.32%, that is $4,637 a month. Cash flow lands at about negative $1,340 a month on $240,000 in.


    Rent needed to break even: about $3,405 a unit.


    Neither number is wrong. They answer different questions. Run both before you fall in love.


    DM me INVEST and I will send you the worksheet 👇


    Example only, my assumptions, not a loan quote. Investor loans usually price above that survey average, so get a real one.


    #RealEstateInvesting #CapRate #CashFlow #LongBeachRealEstate #SouthBayHomes #RentalProperty'
  facebook: 'If you only run one number on a rental, you will eventually buy a bad one.


    Here is the same property under two formulas.


    A $900,000 two-unit. $2,700 a month per unit, so $64,800 gross. Take out 5% for vacancy and $22,000 a year for taxes, insurance, maintenance, water and trash, and reserves. Net operating income is $39,560.


    Cap rate is that NOI divided by the price. $39,560 on $900,000 is 4.4%. Looks ordinary. Nothing alarming.


    But cap rate assumes you paid cash. Most people do not.


    So add the loan. 25% down is $225,000, call it $240,000 in with closing costs. The $675,000 balance at 7.32% over 30 years is $4,637 a month in principal and interest, or $55,641 a year. Subtract that from the $39,560 and you are at roughly negative $16,100 a year. About negative $1,340 a month, out of your pocket, every month.


    Cash-on-cash: negative 6.7%.


    Same building. Same rents. One number said fine, the other said you are feeding it.


    For this one to break even you would need around $3,405 a unit instead of $2,700.


    I am not telling you not to buy it. Some people buy a negative year on purpose, because of the location, or a plan to raise rents, or a unit they will renovate. That is a decision. Discovering it in month three is not.


    Cap rate compares properties. Cash-on-cash tells you what happens to your bank account. Run both.


    These are my assumptions on a made-up property, not a loan quote, and that 7.32% is the Freddie Mac survey average for owner-occupied loans as of October 22. An investment property almost always costs more than that, which means the real answer here would be worse, not better. Get an actual quote.


    What are you using on your own deals, cap rate, cash-on-cash, or something else?


    #RealEstateInvesting #CashFlow #LongBeachRealEstate'
  linkedin: 'A quick illustration of why two investors can look at one property and reach opposite conclusions.


    A $900,000 two-unit, $2,700 per unit per month, 5% vacancy, $22,000 in annual operating expenses. Net operating income of $39,560.


    Cap rate: $39,560 on $900,000 is 4.4%. An unleveraged yield, useful for comparing one building to another.


    Cash-on-cash, with 25% down and about $240,000 in: the $675,000 balance at 7.32% over 30 years costs $55,641 a year in principal and interest. Cash flow is roughly negative $16,100 annually, about negative $1,340 a month. Cash-on-cash of negative 6.7%. Break-even rent is near $3,405 a unit.


    The takeaway is not that the deal is bad. It is that cap rate and cash-on-cash answer different questions, and at current financing costs the gap between them is unusually wide. An asset can be fairly priced on an unleveraged basis and still require monthly funding from the owner.


    The arithmetic is mine, on a hypothetical property, stated with its assumptions. The 7.32% is Freddie Mac''s survey average for owner-occupied 30-year fixed loans as of October 22, 2026; investment-property financing typically prices above it, so a real quote would likely make this worse rather than better. General information, not lending advice.


    Which of the two do you lead with when a client brings you a small multi-family?


    #RealEstate #RealEstateInvesting #HousingMarket'
