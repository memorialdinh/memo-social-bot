  headline: Same duplex. Two *very* different answers.
  stat_value: -6.7%
  stat_label: Cash-on-cash on the same example $900K two-unit that shows a 4.4% cap rate. Example assumptions, 30-yr P&I at 7.32% (Freddie Mac avg, Oct 22, 2026). Not a quote.
