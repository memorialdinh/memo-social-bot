captions:
  instagram: 'Everybody calls it "the money you lose if you back out." That is not what it is.


    Where it goes: escrow. A neutral third party. Not the seller''s pocket.


    What it does: it gets credited to you at closing. It is your own down payment arriving early, not a fee.


    When you get it back: cancel inside your contingency windows, the ones you negotiated, and it generally comes back.


    When it gets interesting: you walk after those windows close, for a reason the contract doesn''t cover.


    California has a rule for that. Civil Code 1675. If the liquidated damages actually paid are 3% of the price or less, you''d have to show the amount was unreasonable. Above 3%, the seller has to show it was reasonable.


    Which means those deadlines in your contract are the real protection. Not the deposit size.


    DM me BUYER for the roadmap 👇


    General info, not legal advice. Read your contract, and talk to an attorney about your own situation.


