  linkedin: 'Earnest money generates more client anxiety than almost any other line in a purchase agreement, usually because it gets described as money at risk rather than money in transit.


    The mechanics: the deposit goes to escrow, not the seller, and is credited to the buyer at closing. It is the down payment arriving early. A cancellation made inside a negotiated contingency period, following the contract, generally returns it.


    The exposure sits outside those windows. California Civil Code section 1675 governs liquidated damages on a purchase contract for a dwelling of not more than four units that the buyer intended to occupy. Where the amount actually paid does not exceed 3% of the purchase price, the provision stands unless the buyer establishes the amount is unreasonable. Where it exceeds 3%, it is invalid unless the party upholding it establishes the amount is reasonable. Validity also depends on the signing formalities in the surrounding sections.


    Two common misreadings worth correcting with clients: the statute does not entitle a seller to 3%, and it does not cap the deposit a buyer may offer. It allocates the burden of proving reasonableness.


    The practical advice that follows is unglamorous. Calendar the contingency dates at the opening of escrow. Deadline discipline protects the deposit; deposit size does not.


    General information only, not legal advice.


