  facebook: 'Earnest money is the part of the process people fear most and understand least. Let''s fix that.


    First, where it goes. Not to the seller. It is deposited with escrow, a neutral third party whose job is to hold it and follow the written instructions both sides agreed to. Nobody can just take it.


    Second, it is not an extra cost. At closing it is credited toward your down payment and costs. You were going to bring that money anyway. It arrives earlier, that is all.


    Third, the part that matters. Your contract gives you contingency periods, for the loan, the appraisal, the inspection. Cancel inside those windows, following the contract, and the deposit generally comes back to you. That is the entire point of them.


    The risk shows up when you walk after those windows have passed, for a reason the contract does not give you.


    California addresses that in Civil Code section 1675. For a dwelling of four units or fewer that the buyer intended to live in, if the liquidated damages actually paid come to 3% of the purchase price or less, the burden falls on the buyer to show that amount was unreasonable. If it exceeds 3%, the seller has to show it was reasonable. The clause also has its own signing requirements to be effective at all.


    Two things that are not true, and I hear both every month. It does not mean the seller automatically keeps 3%. And it is not a limit on what you are allowed to deposit.


    What it should tell you: protect your dates. Calendar every contingency deadline the day you open escrow. The deposit is not what keeps you safe, the deadlines are.


    Comment BUYER and I will send you the step-by-step.


    General information, not legal advice. Your contract controls, and a real dispute is a question for an attorney.


