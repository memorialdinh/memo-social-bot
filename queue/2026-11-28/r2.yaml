  default: |-
    Every year. Same conversation. Usually the second week of December. 😅

    "Let's just wait. Nobody is looking right now."

    And then I spend the week between the holidays unlocking doors.

    I get why it feels that way. The neighborhood is quiet, everyone is traveling, the mailbox is full of cards instead of flyers. It looks like nothing is happening.

    What I will say is this: the people out looking in late December chose to be out looking in late December. Nobody is killing time.

    So the real question is not whether to list. It is whether your house is ready to be seen if someone knocks.

    Comment 'SELLER' and I'll send you the short version of how I handle a holiday listing.

