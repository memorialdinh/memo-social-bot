  linkedin: |-
    There is a conversation that happens every year around the second week of December: "let's wait, nobody is looking right now."

    It is an understandable read. The street is quiet, people are traveling, and the usual signals of activity go away for a few weeks. But the buyers who are out between the holidays chose to spend that week looking at houses, which tells you something about where they are in the process.

    The useful question is not list or wait. It is whether the property is ready to be seen on short notice if someone does knock.

