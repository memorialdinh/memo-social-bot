captions:
  default: 'Offer accepted. The next 72 hours matter more than you think.


    Before you wire a dollar, call escrow at a number you already know. Never trust wiring instructions from an email alone.

    Book your inspections on day one. The clock is already running.

    Get your lender every document fast and ask about locking your rate.


    Comment BUYER and I''ll send you my escrow checklist.


    #FirstTimeHomeBuyer #TorranceRealEstate #LongBeachRealEstate #SouthBayHomes #HomeBuyingTips #EscrowTips #LakewoodCA'
  linkedin: 'The most expensive mistakes in a home purchase often happen in the first three days after acceptance, not at the negotiating table.


    Three moves that protect a buyer early: verify wiring instructions by calling escrow at a known number, schedule inspections immediately because contingency timelines start at acceptance, and get documents to the lender quickly while discussing a rate lock.


    Takeaway: speed and verification in week one prevent problems in week four.


    What''s the first thing you tell clients the day their offer is accepted?


    #RealEstate #HomeBuying #WireFraud'
