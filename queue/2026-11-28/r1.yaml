    7.21%.

    That is the 30-year fixed average as of Nov 25, 2026, down from 7.28% the week before (Freddie Mac PMMS). A year earlier the same survey read 6.23%.

    What seven basis points actually do: on a $700,000 loan at 30 years, principal and interest runs about $33 a month lower than it did last week. An example with stated assumptions, not a loan offer, and not a quote for you.

    Worth knowing what the survey is before you read too much into it. PMMS tracks conventional, conforming, fully amortizing purchase loans for borrowers putting 20% down with excellent credit. Your file is its own file.

