captions:
  default: |-
    FHFA set the 2027 conforming loan limits on Nov 24, 2026, and the number matters more here than almost anywhere.

    The baseline for a one-unit property goes to $855,400, up $22,650 from 2026. High-cost areas, which is most of what I work in, carry a ceiling of $1,283,100 for one unit, or 150% of that baseline.

    Why the change: FHFA reported house prices up 2.72% on average between the third quarters of 2025 and 2026, and the baseline moves by that same percentage. FHFA also says the limit rises in all but 24 counties or county equivalents nationally.

    What it actually means in practice: the conforming limit is the line between a conventional conforming loan and a jumbo. Different underwriting, different pricing, different documentation. Moving that line moves which side of it a purchase price lands on.

    Every county has its own figure on FHFA's published list, so the number that matters is yours, not the national one.

    Source: FHFA news release, Nov 24, 2026. General information, not lending advice.

    DM me 'BUYER' and I'll pull the 2027 limit for the county you're shopping in.

