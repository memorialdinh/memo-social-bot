captions:
  default: 'Buying a rental that already has tenants? You''re buying their leases too.


    Read every lease and match it to the rent roll. Rent, term, deposit, utilities.

    Get a signed estoppel from each tenant so there are no surprise side deals.

    Check state and city rent rules before you remove contingencies.


    DM me ''INVEST'' and I''ll send you my rental checklist.


    #LongBeachRealEstate #LakewoodCA #RealEstateInvesting #RentalProperty #SouthBayHomes #DuplexInvesting #LongBeachInvestor'
  linkedin: 'When you buy a tenant-occupied property, the leases come with it. The numbers in the listing are only as good as the paper behind them.


    Three checks before contingencies come off: read every lease against the rent roll, get a signed estoppel certificate from each tenant confirming rent, deposit and any side agreements, and confirm which state and local rent rules apply to the property.


    Takeaway: verify the income before you own it, not after.


    What''s the one document you never skip on a rental purchase?


    #RealEstateInvesting #CommercialRealEstate #RealEstate'
