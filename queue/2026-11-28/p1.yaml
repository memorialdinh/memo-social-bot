captions:
  default: 'A condo offer is really two offers. One on the unit, one on the association behind it.


    Five things I confirm before my client signs anything:


    1. The reserve study. How much the HOA has set aside, and for what.

    2. Litigation. Whether the association is in any, and what it is about.

    3. The rental cap. How many units can be rented, and whether the cap is already met.

    4. The master insurance policy. What it covers, and where your own policy has to start.

    5. Special assessments. Any that passed, and any that are being discussed.


    None of this is exotic. It all sits in the documents the seller orders for you. The problem is that most buyers get them and skim them, and the answers are the kind that cost real money later.


    Checked three or more? You are further along than most people writing offers this weekend.


    General information, not legal advice. Your own attorney reads your documents.


    DM me ''BUYER'' and I''ll send the list I hand clients before a condo offer.


    #LongBeachRealEstate #LakewoodHomes #CerritosCA #TorranceHomes #SouthBayHomes #SoCalRealEstate #firsttimehomebuyer'
  linkedin: 'A condo purchase carries a second set of diligence that a single-family purchase does not, and it rarely gets the same attention.


    Five items worth confirming before an offer goes out: the reserve study, whether the association is in litigation, the building''s rental cap and whether it is already met, what the master insurance policy covers and where the owner''s policy begins, and any special assessment that has passed or is under discussion.


    All five live in the documents the seller orders. The failure mode is not access, it is that they arrive late and get skimmed.


    General information, not legal advice.


    Which of the five has cost your clients the most?


    #RealEstate #HomeBuying #Condos'
