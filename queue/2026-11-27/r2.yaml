captions:
  default: |-
    A loan rarely dies on the big stuff. It stalls on one line of a bank statement.

    Underwriting reads your last couple of statements and asks one question about every deposit that isn't your paycheck: where did this come from?

    If you can answer it on paper, it's a non-event. If you can't, that money usually can't be counted toward your down payment or your reserves.

    What answers it: a transfer from your own account with both statements. A gift with a signed letter and the donor's record of sending it. A bonus or commission with the pay stub. A sale with the receipt.

    What doesn't: cash. Cash deposited with no origin is the one that stops the file.

    Easiest fix is the boring one. Leave your down payment where it is for a couple of months before you shop, and keep the paperwork for anything that moves.

