  linkedin: |-
    Most loan delays I see are not credit or income. They are one deposit nobody can source.

    Underwriting reviews recent bank statements and asks the same question of every deposit that is not a regular paycheck: what is the origin? Answerable on paper, it is routine. Unanswerable, and those funds generally cannot be counted toward down payment or reserves.

    What answers it: an internal transfer with both statements, a documented gift with a letter and the donor's record, a bonus with the pay stub, an asset sale with the receipt. Cash with no origin is the one that holds a file.

    The takeaway worth passing to any buyer: let the down payment sit, and document anything that moves. General information, not lending advice.

