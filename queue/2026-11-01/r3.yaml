captions:
  instagram: 'Five numbers. Have them before you write the offer, not after.


    Actual rents, not pro forma. Twelve months of real expenses. Property tax at YOUR purchase price, not the seller''s. An insurance quote in writing. The deferred maintenance, priced.


    The third one catches the most people. California reassesses at your value when you buy, so the seller''s tax line is not your tax line.


    Four or more checked? You''re ready to run the real number.


    DM ''INVEST'' for the worksheet I use.


    #RealEstateInvesting #RentalProperty #LongBeachRealEstate #SouthBayRealEstate #InvestorTips #CashFlow'
  facebook: 'The deals that go sideways usually weren''t bad deals. They were deals underwritten on the wrong five numbers.


    Run through these before you write an offer:


    1. Actual rents, not projected. A pro forma is a hope, not a rent roll. Ask for leases.

    2. Twelve months of real operating expenses. Not an estimate, not a percentage rule.

    3. Property tax calculated at your purchase price. Under Prop 13, your assessment is based on your value when you buy, so a long-time owner''s tax line tells you very little about yours. This is the single most common miss I see.

    4. An insurance quote in writing. Quotes have moved a lot. Don''t carry last year''s assumption.

    5. Deferred maintenance, priced. Roof, sewer line, panel, water heater. If it''s at the end of its life, it''s a cost with a date on it, not a surprise.


    Four or more of those in hand and you can actually run the number instead of guessing at it.


    General information, not tax or investment advice. Your CPA and the county assessor have the final word on the tax side.


    Which of the five do you skip most often? Be honest.


    #RealEstateInvesting #RentalProperty #InvestorTips'
  linkedin: 'Most rental deals that disappoint weren''t mispriced. They were underwritten on five numbers the buyer didn''t actually have.


    Actual rents, evidenced by leases, rather than a pro forma.


    Twelve months of operating expenses, rather than a percentage rule applied to gross rent.


    Property tax computed at the buyer''s purchase price. Under Proposition 13 the assessment follows the new base year value on a change in ownership, so a long-held seller''s tax line understates the buyer''s carrying cost, often badly. In my experience this is the most frequent single error in a first underwrite.


    An insurance quote in writing, current to this market rather than last year''s assumption.


    Deferred maintenance priced by component and remaining life, not treated as contingency.


    Four of the five in hand is the threshold where the return figure means something. Below that, you''re modeling the seller''s property, not yours.


    General information, not tax or investment advice.


    What''s the line item you''ve seen blow up a first-year pro forma?


    #RealEstateInvesting #CommercialRealEstate #Investing'
