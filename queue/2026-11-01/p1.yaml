    #LongBeachRealEstate #SouthBayHomes #FirstTimeHomeBuyer #MortgageTips #TorranceHomes #LakewoodCA'
  facebook: '"Should I pay points?" came up three times this week, so here''s the short version.


    A point is 1% of your loan amount. Pay it at closing and your interest rate comes down. On a $600,000 loan, one point is $6,000 out of pocket.


    The trade is simple to say and hard to feel: more cash now, less interest later. The CFPB''s guidance is that points can be a good choice if you plan to keep the loan a long time, and that if you don''t know how long you''ll stay, you may not want to pay them at all. How much the rate drops per point isn''t fixed either. It depends on the lender, the loan and the market that week.


    For context, the 30-year fixed averaged 7.24% for the week ending Oct 29, 2026, down from 7.32% the week before (Freddie Mac).


    What I''d actually do: ask your loan officer to show you the same loan with points and without, and total both over the shortest, longest and most likely time you''d keep it. The paper usually answers it for you.


    Would you rather have the lower payment or the bigger cushion after closing?


    #MortgageTips #SoCalRealEstate'
  linkedin: 'The points question is rarely a rate question. It''s a holding-period question.


    One discount point costs 1% of the loan amount and buys a lower interest rate. How much lower is not standardized: the CFPB notes the reduction depends on the lender, the loan type and the mortgage market. So the decision can''t be made from the rate sheet alone.


    The useful exercise is the one the CFPB recommends: price the loan with points and without, then total the cost of each over the shortest, longest and most likely period you''d hold it. If the breakeven lands past your realistic horizon, the cash belongs in reserves.


    Context: the 30-year fixed averaged 7.24% for the week ending Oct 29, 2026, down from 7.32% a week earlier (Freddie Mac PMMS).


    Buyers I talk to underestimate how often they''ll move or refinance. How do you frame holding period with your clients?


    #RealEstate #Mortgage #HomeBuying'
