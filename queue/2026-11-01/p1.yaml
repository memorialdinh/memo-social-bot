captions:
  instagram: 'Two buyers. Same loan. Same day. One pays points, one keeps the cash.


    A point is 1% of the loan amount. On $600,000 that''s $6,000 at closing to buy the rate down.


    The CFPB puts it plainly: points can be a good choice if you plan to keep your loan a long time. If you don''t know how long, that $6,000 may do more sitting in your reserves.


    For scale, the 30-year average was 7.24% the week ending Oct 29, 2026 (Freddie Mac). Ask your lender to price it both ways before you decide.


