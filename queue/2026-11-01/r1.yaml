  term: Homeowners' Exemption
  pos: noun / California property tax
  definition: A $7,000 reduction in your home's assessed value, for a dwelling you occupy as your principal residence (CA BOE Pub 800-6, 6-23).
  why: At a 1% tax rate the BOE says that generally equates to about $70 a year, and annual filing is not required once it's granted.
  example: File form BOE-266 with your county assessor by Feb 15 for the full $7,000. Filed later, up to Dec 10, you get 80% ($5,600). Buy after Jan 1 and occupy within 90 days and it can apply to the supplemental assessment.
