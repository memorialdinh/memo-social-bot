captions:
  instagram: 'If you bought a home in California and never filed this, you''re leaving money on the table every single year.


    The Homeowners'' Exemption takes $7,000 off your home''s assessed value on the house you actually live in. At a 1% tax rate the state says that''s generally around $70 a year.


    Not huge. But it''s one form, and the BOE says annual filing is not required once you have it.


    Form BOE-266, filed with your county assessor. By Feb 15 for the full amount. After that, up to Dec 10, you get 80%.


    DM ''VALUE'' and I''ll send my new-owner list.


    General information, not tax advice. Your county assessor has the final word.


    #CaliforniaRealEstate #PropertyTax #NewHomeowner #LongBeachRealEstate #SouthBayHomes #HomeownerTips'
  facebook: 'Here''s a small one that gets missed constantly, especially by people who bought in the last year or two.


    California has a Homeowners'' Exemption: $7,000 off the assessed value of the home you occupy as your principal residence. The Board of Equalization''s own publication says that at a 1% tax rate it generally works out to about $70 a year, and gives an example where a 1.17% rate makes it $82.


    The details that matter:


    - You have to occupy it as your principal residence as of January 1 to qualify for that year.

    - It''s form BOE-266, filed with your county assessor''s office.

    - File by February 15 and you get the full $7,000. File after that but on or before December 10 and you get 80%, which is $5,600. After December 10, nothing for that year.

    - Once it''s granted, annual filing is not required. It stays until something changes, like selling or moving out.

    - It doesn''t apply to a rental, a vacant property, or a vacation or second home.

    - Bought after January 1? If the prior owner didn''t have the exemption and you occupy within 90 days, it can apply to your supplemental assessment.


    This is general information from the state''s publication, not tax advice, and your assessor''s office is the authority on your specific parcel.


    Did you file yours, or is this the first you''re hearing of it?


    #PropertyTax #CaliforniaRealEstate #NewHomeowner'
  linkedin: 'A quiet line item worth checking with every new California homeowner: the Homeowners'' Exemption.


    It reduces the assessed value of an owner-occupied principal residence by $7,000. The Board of Equalization''s Publication 800-6 notes that at the 1% statewide rate this generally equates to roughly $70 in annual savings, and illustrates $82 at a 1.17% rate.


    The mechanics are what get missed. Occupancy as of January 1 governs eligibility for that year. The claim is form BOE-266, filed with the county assessor. Filed by February 15 it yields the full exemption; filed after that but on or before December 10 it yields 80%, or $5,600. Once granted, annual filing is not required. It does not apply to rented, vacant, or secondary properties. For a purchase after the lien date, occupancy within 90 days can bring it onto the supplemental assessment.


    General information drawn from the state''s publication, not tax advice.


    Small dollars, but it''s a trust-builder with a buyer three months after closing. What else belongs on a post-closing follow-up list?


    #RealEstate #PropertyTax #California'
