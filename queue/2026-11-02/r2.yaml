captions:
  instagram: 'Buyers ask all five of these. Usually in the first week.


    How old is the roof. When was the HVAC last serviced. Are there permits. What do the dues cover. Which
    appliances stay.


    You don''t need perfect answers. You need to not be guessing on the spot.


    How many did you get? Comment ''SELLER'' and I''ll send my prep list.


    #SellingYourHome #LongBeachRealEstate #SouthBayHomes #HomeSelling #SellerTips #SoCalRealEstate'
  facebook: 'Five questions. If you''re thinking about selling, see how many you can answer without looking
    anything up.


    1. Roughly how old is the roof?

    2. When was the HVAC last serviced?

    3. Do you have permits for the work you''ve had done?

    4. What do your HOA dues actually cover, if you have an HOA?

    5. Which appliances stay with the house?


    Every one of these comes up, usually in the first week, and usually from a buyer who is deciding whether
    to trust the rest of what they''re told. "I''m not sure" on all five reads very differently than "I''m
    not sure" on one.


    The good news is that this is a weekend of digging through a drawer, not a renovation. Receipts, service
    records, the permit history, the HOA packet. Pull them before you list and the whole process gets
    quieter.


    And if you genuinely don''t know something, say so. "I don''t know, the previous owner did it" is
    a fine answer. Guessing is not.


    Which one of the five stumped you?


    #HomeSelling #SellerTips'
  linkedin: 'A short diagnostic for anyone considering a sale in the next year. Five questions, answered
    from memory:


    1. Roughly how old is the roof?

    2. When was the HVAC last serviced?

    3. Are there permits for work performed?

    4. What do the HOA dues cover?

    5. Which appliances convey?


    Each of these surfaces in early buyer conversations. The insight is not that sellers should know the
    answers, it''s what the pattern of answers signals. Uncertainty on one item reads as normal. Uncertainty
    across all five reads as a property that hasn''t been tracked, and it changes how a buyer weighs everything
    else they''re told, including the things that are documented.


    The takeaway: this is a records exercise, not a capital improvement. Service history, permit records
    and the HOA packet assembled before listing cost a weekend and remove a category of friction from
    the transaction. "I don''t know, that predates us" is a credible answer. An improvised one is not.


    What pre-listing preparation do you find returns the most, relative to what it costs?


    #RealEstate #HomeSelling #SellerTips'
