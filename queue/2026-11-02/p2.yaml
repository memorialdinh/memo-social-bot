captions:
  instagram: 'Nobody has ever sent a quick question.


    And nobody has ever been more guilty of answering it at length, immediately, than me.


    "No rush" is doing a lot of work in that sentence.


    DM me ''BUYER'' with yours. I''ll try to keep it under four paragraphs.


    #RealTalk #RealEstateLife #LongBeachRealEstate #SouthBayHomes #AgentLife #SoCalRealEstate'
  facebook: 'The text arrives at 10:47pm. "Quick question, no rush."


    Reader, there is always a rush. And the question is never quick.


    But here''s my confession: I''m the problem. I could wait until morning. I could send back one line. Instead I''m up at 10:49pm writing four paragraphs about contingency timelines to someone who is already asleep.


    In my defense, the questions that come in late are usually the ones people have been sitting on all day, turning over, not wanting to bother anyone about. Those are the good ones. That''s the question someone actually needs answered.


    So keep sending them. I''ll keep over-answering them.


    What''s the question you''ve been sitting on and haven''t asked anyone yet?


    #RealEstateLife #RealTalk'
  linkedin: 'A small observation about client service that took me too long to notice.


    The questions that arrive late at night are rarely trivial. They''re the ones someone has been carrying around all day, deciding whether it''s worth bothering anyone about. By the time it gets typed out as "quick question, no rush," it has usually already been thought about for hours.


    Which means the response time matters less than people assume, but the thoroughness matters more. The instinct to fire back one line and go to bed is usually wrong. The instinct to over-explain at 10:49pm is, embarrassingly, usually right.


    I''d rather be the person who sends four paragraphs than the person who makes someone feel like they interrupted.


    What''s your rule on after-hours client messages?


    #RealEstate #ClientService #RealTalk'
  tiktok: 'No one has ever sent a quick question. And I have never once answered one briefly. #realestatelife #realtalk #agentlife #realestatetips #socalrealestate'
