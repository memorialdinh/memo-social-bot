captions:
  instagram: 'A lender isn''t judging you. It''s building a file.


    Five things go in it, roughly in this order:


    Income, and whether it holds up. Assets, and how long they''ve been where they are. Debts, all of them. Credit, pulled by the lender. Then the property itself, once you''re in contract.


    The last one surprises people. The house gets underwritten too.


    General information, not lending advice. DM me ''BUYER'' and I''ll send the document list.


    #FirstTimeHomeBuyer #MortgageTips #LongBeachRealEstate #SouthBayHomes #HomeBuying #SoCalRealEstate'
  facebook: '"What do they actually look at?" I get this one constantly, and the answer is less mysterious than people expect.


    A lender is assembling a file with five parts.


    Income. Pay stubs, W-2s, or returns if you''re self-employed. They care as much about how steady it is as how big it is.


    Assets. Where the down payment and your cushion are sitting, and how long they''ve been sitting there. Money that showed up last week gets questions.


    Debts. Every monthly payment on your credit report. Not the ones you think are significant, all of them.


    Credit. The lender pulls its own report. The number in your banking app is a useful ballpark and it is not the number they''ll use.


    And then the property. People forget this one. Once you''re in contract, the house gets an appraisal and a title search. You can be perfectly approved and still have the deal turn on what the appraiser or the title company finds.


    None of this is a test you pass by being impressive. It''s paperwork that either lines up or doesn''t, and most of the "doesn''t" is fixable if you find it early.


    General information, not lending advice, and your loan officer is the one who can speak to your file.


    Which of those five would be hardest for you to pull together right now?


    #MortgageTips #FirstTimeHomeBuyer'
  linkedin: 'Buyers consistently misread the underwriting process as an evaluation of them. It is closer to document reconciliation.


    Five components, in rough sequence:


    1. Income. Pay stubs, W-2s or tax returns, assessed for stability as much as amount.

    2. Assets. The source and seasoning of the down payment and reserves. Recently deposited funds invite documentation requests.

    3. Debts. Every recurring obligation on the credit report, not a self-reported subset.

    4. Credit. A report the lender pulls directly. Consumer app scores are directional, not the figure used in the decision.

    5. The property. Appraisal and title work, after the contract is signed.


    The fifth is where otherwise-clean approvals come apart, and it is the one buyers are least prepared for, because it has nothing to do with their file at all.


    The practical takeaway for anyone advising buyers: surface items 1 through 3 before the offer, not after. Most problems there are solvable with time, and time is what an active contract removes.


    General information, not lending advice.


    What''s the documentation issue you see derail deals most often?


