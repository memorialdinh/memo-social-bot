captions:
  instagram: 'I have had this exact conversation more times than I can count.


    "Give them room to talk" turns into the garage, the backyard, or a slow lap of the block in the car. I get it. It''s your house. Thirty years of your life are in it and strangers are opening your cabinets.


    But buyers won''t say the honest thing in front of you, and the honest thing is what we need to hear.


    Go get a coffee. I''ll tell you everything they said.


    #RealTalk #SellingAHome #RealEstateHumor #HomeSelling #LongBeachRealEstate #SouthBayHomes'
  facebook: 'Me: we''ll give the buyers some space so they can talk freely.


    Seller: I''ll just be out in the garage.


    Every single time. And honestly, I understand it completely — it''s your home, you know where everything is, and you want to be there to explain why the third bedroom is the good one.


    Here''s the problem. Buyers won''t say what they actually think while you''re forty feet away reorganising the tool bench. They''ll be polite, they''ll leave, and we''ll learn nothing. The feedback that helps us is the feedback they only give when the house feels empty.


    So go get a coffee. I''ll write down everything, including the parts you won''t love.


    Sellers, be honest — did you leave, or did you hover?


    #RealEstateHumor #HomeSelling'
  linkedin: '"We''ll give the buyers some space to talk freely."


    "I''ll just be out in the garage."


    It happens on most listings, and it is entirely human. A seller has decades in a house and a reasonable belief that nobody can explain it better than they can.


    It also reliably costs them information. Buyers do not voice genuine objections within earshot of the owner. They stay polite, they leave, and the agent is left with nothing actionable. The candid reaction — the kitchen, the price, the layout — is the thing worth hearing, and it only surfaces in an empty house.


    A small discipline with real value: leave the property, and ask your agent for the unflattering version of the feedback.


    What''s the hardest habit you''ve had to coach a client out of?


    #RealEstate #HomeSelling #ClientRelationships'
