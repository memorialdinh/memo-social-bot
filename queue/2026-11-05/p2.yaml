  headline: Same money, *two different* moves.
  term: Seller credit
  pos: noun · purchase contract
  definition: Money the seller puts toward the buyer's closing costs instead of cutting the price.
  why: A credit hits the buyer's cash at closing. A price cut spreads over 360 payments.
