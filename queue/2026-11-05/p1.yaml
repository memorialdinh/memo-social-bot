  linkedin: |-
    When agents evaluate a brokerage move, the comparison usually runs on splits, caps and technology. Those are easy to tabulate. Support is not, which is why it tends to get left out of the spreadsheet and then decides how the first difficult year goes.

    From Epique's agent-facing materials: Power Coaching is described as 1:1 coaching on the agent's own business, Forever Mentorship as on-call access to a personal mentor, alongside daily live classes spanning fundamentals to niche topics, and several team structures including Family, Traditional and Power Teams.

    The specifics, including eligibility, are governed by Epique's current plan terms, and anyone considering a move should read those directly rather than any recruiter's summary of them.

    The takeaway for anyone weighing a change: ask what happens on the day a transaction goes sideways, and ask who specifically picks up.

    For agents who have moved brokerages: what do you wish you had asked before you signed?

