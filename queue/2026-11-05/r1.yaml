  linkedin: |-
    A question I'd put to anyone buying a home this year: do you know what your buyer representation agreement says?

    Three things sit in it. Who represents you. For how long. And how that representation is compensated.

    What it is not is a commitment to purchase. The confusion between those two is common, and it leads buyers either to avoid signing anything or to sign without reading, both of which work against them.

    The practical advice is narrow: find the term, find the compensation language, and ask what the exit looks like before you need one. A professional relationship you understand is a better one.

    This is general information rather than legal advice, and the governing document is always the agreement in front of you.

    Agents: what's the question clients should ask here and almost never do?

