  facebook: |-
    Quick quiz. When you sign a buyer representation agreement, what are you actually agreeing to?

    A) You're promising to buy a home
    B) Who represents you, for how long, and how they get paid
    C) Nothing, until you write an offer

    It's B. And that middle part is the one people skip.

    The agreement doesn't commit you to buying anything. It sets up the working relationship: the agent's duties to you, a term with an end date, and how compensation is handled. None of that is a trap, but all of it is negotiable in the sense that you should understand it before you sign, and you should ask what happens if the relationship isn't working.

    General information, not legal advice. Your own agreement is the one that governs, so read that one with your agent.

    Did anyone walk you through yours line by line?

