    "I'll be paying PMI forever" is one of the most common and most expensive misreadings a buyer brings to a consultation.

    On a conventional loan, private mortgage insurance attaches when the down payment is under 20 percent, and the CFPB sets out two separate exits. The borrower may request cancellation when the principal balance is scheduled to reach 80 percent of the home's original value. The servicer must automatically terminate it when the balance is scheduled to reach 78 percent. There is also a midpoint-of-amortization backstop, which on a 30-year loan arrives after year 15.

    The practical gap is between those first two numbers. The 80 percent exit is a right the borrower has to exercise, in writing, while current on payments, with no junior liens and evidence the value has not fallen below original value. The 78 percent one happens without anybody asking. A borrower who does not know the difference simply pays longer.

    Worth saying out loud: these rules cover single-family principal residences on loans closed on or after July 29, 1999, and FHA and VA are their own conversation. General information, not lending advice.

    Who on your side of a transaction is telling the buyer about the 80 percent request?

