captions:
  default: |-
    Putting less than 20 percent down does not mean paying mortgage insurance for the life of the loan. Most buyers I talk to think it does.

    On a conventional loan, PMI shows up because the down payment is under 20 percent. It is your cost and it covers the lender. And there are two different ways it comes off.

    1. You can ask. Once your principal balance is scheduled to reach 80 percent of the home's original value, you have the right to request cancellation in writing. Extra payments can get you there sooner.

    2. It comes off on its own. The servicer must automatically terminate PMI on the date the balance is scheduled to reach 78 percent of original value.

    Two details that trip people up. "Original value" generally means the contract sales price or the appraised value at purchase, whichever is lower. And to request cancellation you need to be current with a good payment history, certify there are no junior liens, and show the value has not dropped below that original value.

    There is also a backstop: the month after you pass the midpoint of your amortization schedule, it has to end. On a 30-year loan that is after 15 years.

    One thing to know before you plan around any of this: these rules apply to single-family principal residences with loans that closed on or after July 29, 1999. FHA and VA loans work differently, and if the lender is paying the mortgage insurance, different rules apply again.

    General information, not lending advice. Your servicer answers for your loan.

