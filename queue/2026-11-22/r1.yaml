captions:
  default: 'Most agents don''t leave a brokerage because of the split. They leave because nobody ever told them what Monday looks like.


    So here is mine, for anyone licensed anywhere who is weighing a move. This is my own onboarding cadence, not a program description.


    Week 1 is logistics and it is the week people underestimate. License moved, systems set up, your database actually imported instead of sitting in a spreadsheet.


    Week 2 is talking to people. Scripts, role-play with me, then live calls while I listen. Not a recording of someone else''s call.


    Week 3 is the part most agents have never done: a 90-day plan on paper, with the numbers in it. Conversations per week, appointments per month, what has to be true.


    Week 4 we prep a listing appointment and I go with you. Not to take it. To let you run it and tell you what I saw after.


    Thirty days of structure, not a welcome email and a hope.


    I''m not going to tell you what you''ll make, because nobody honestly can. I''ll tell you what the first month looks like and you can decide whether that''s what''s missing.


    DM me ''MATH'' and I''ll send you the 30-day map.


    #RealEstateAgents #AgentLife #RealEstateCareer #RealtorLife #AgentGrowth #NewAgent'
  linkedin: 'Agents rarely leave a brokerage over the split. They leave because the first month after they sign is unstructured, and nobody warned them it would be.


    Here is the onboarding cadence I run with agents who join my team. It is mine, not a program description.


    Week one is operational: license moved, systems configured, database imported rather than left in a spreadsheet. Week two is conversation work — scripts, role-play, then live calls with me listening. Week three is a written 90-day plan with real inputs in it: conversations per week, appointments per month, what has to be true for the year to work. Week four we prepare a listing appointment together and I attend, not to take it, but to debrief it afterward.


    The reason I publish the cadence instead of the pitch is that structure is checkable and a promise isn''t. I won''t tell an agent what they''ll earn, because nobody honestly can. I''ll tell them what thirty days looks like.


    Open to any licensed agent, wherever you''re licensed.


    What did your first thirty days at a new brokerage actually look like?


    #RealEstate #RealEstateAgents #Leadership'
