  facebook: 'There is always a misc box.


    Forty boxes labeled by room. Kitchen, primary bedroom, garage, office. Someone bought a label maker. Everyone felt organized.


    Then there is box 41. No label but misc. Inside: the phone chargers, the shower curtain rings, the remote to something, the coffee filters, half a roll of tape and the one screwdriver that fits the TV mount.


    That box is the entire first night in the new house.


    My honest advice after enough of these: make the misc box on purpose. Pack it last, label it FIRST NIGHT, put it in the front seat of your car, and do not let it go in the truck. Chargers, toilet paper, soap, towels, scissors, a pan, the coffee setup, and whatever your kid or your dog cannot sleep without.


    What is always in your misc box? Mine is the coffee.


    #MovingDay #RealTalk'
  linkedin: 'Forty boxes labeled by room. One box labeled misc.


    The misc box contains the chargers, the shower curtain rings, the coffee filters and the one screwdriver that fits the TV mount. It is also, reliably, the box nobody can find on the first night.


    There is a small lesson in it that applies well past moving day. The organized part of any process is the part people plan for. The friction almost always lives in the leftover category nobody wanted to name.


    In a transaction, the misc box is usually the utility transfers, the mail forwarding, the key handoff and who is meeting the appraiser. None of it is complicated. All of it gets left to the end.


    Pack it on purpose. Label it FIRST NIGHT. Keep it in your car.


    What is in your misc box?


    #RealEstate #MovingTips #HomeOwnership'
