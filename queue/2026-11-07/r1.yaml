captions:
  instagram: 'You asked: who actually pays closing costs in California?


    Shorter answer than you think: whoever the contract says.


    Usually on the buyer: lender fees, the appraisal, the credit report, recording fees, and the prepaid items your lender collects up front.


    Usually on the seller: the commission and the county transfer tax.


    Negotiated all the time: the escrow fee, the owner''s title policy, a home warranty, and any credit toward your costs.


    Here is the part nobody tells first-time buyers. California has no statewide rule for most of this. It is local custom, and custom is just a starting point. Ask for a written estimate early, then ask what is negotiable.


    DM me ''BUYER'' and I''ll send you the list I give my clients.


    #ClosingCosts #FirstTimeHomeBuyer #HomeBuyingTips #LongBeachRealEstate #SouthBayHomes #RealEstateTips'
  facebook: 'A question I got twice this week: who pays closing costs in California, the buyer or the seller?


    The real answer is that most of it is negotiable and the rest is local custom. There is no statewide rulebook that assigns every line.


    What usually lands on the buyer: lender and underwriting fees, the appraisal, the credit report, recording fees, and the prepaid taxes and insurance your lender collects at closing.


    What usually lands on the seller: the commission and the county documentary transfer tax.


    What gets negotiated, constantly: the escrow fee, the owner''s title policy, a home warranty, and whether the seller credits money toward the buyer''s costs. In a slower stretch of the market, that last one comes up a lot.


    Two things that will save you real money. One, ask your lender for a written estimate before you fall in love with a house, not after. Two, when you write an offer, ask your agent which lines in your market are actually movable. People assume the whole sheet is fixed. It is not.


    Buyers and sellers: did anything on your closing statement surprise you?


    #ClosingCosts #HomeBuyingTips'
  linkedin: '"Who pays closing costs in California?" is one of the most common questions buyers bring to a first consultation, and the honest answer is less satisfying than they expect: most of it is negotiable, and the defaults are local custom rather than statute.


    The typical split looks like this. Buyer side: lender and underwriting fees, appraisal, credit report, recording, and prepaid taxes and insurance collected at closing. Seller side: the commission and the county documentary transfer tax. Negotiated: escrow fee, owner''s title policy, home warranty, and any seller credit toward buyer costs.


    The practical insight for anyone advising buyers is that treating the fee sheet as fixed quietly costs clients money. A written estimate early in the process, followed by a line-by-line conversation about what is actually movable in that county, is where the negotiation lives.


    Agents and lenders: which closing cost line do you find clients are most surprised to learn is negotiable?


    #RealEstate #HomeBuying #ClosingCosts'
  tiktok: 'Who pays closing costs in California? Mostly whatever the contract says. Custom is just the starting point.


    #closingcosts #firsttimehomebuyer #realestatetips #homebuying #buyeragent'
