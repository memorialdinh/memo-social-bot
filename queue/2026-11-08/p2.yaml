captions:
  instagram: 'Appointment confirmed Thursday. Code confirmed Friday. Forty minutes of freeway on Saturday
    morning.


    Lockbox: no.


    I have stood on a porch typing four digits with increasing confidence that the problem was my thumbs.
    It never is. Somebody changed the code and told nobody.


    So now I confirm it the morning of, and I ask for a second contact. Both habits came from that exact
    porch.


    #RealTalk #RealEstateLife #LongBeachRealEstate #SouthBayHomes #ShowingDay #SoCalRealEstate'
  facebook: 'Saturday morning showing. Appointment confirmed Thursday. Lockbox code confirmed Friday.
    Forty minutes of freeway with a coffee and a buyer who is genuinely excited.


    Lockbox: nope.


    So you try it again, slower, as if the box is going to respect the effort. Then you try it with the
    other hand. Then you call the listing agent, who is at a soccer game, and the backup number rings
    out, and your buyer is being very polite about standing in a driveway.


    Almost every time, the code got changed and the showing instructions did not. It is nobody''s fault
    and it is deeply annoying.


    What I do now: confirm the code the morning of, not the day before, and get a second contact on the
    listing. Two minutes, and it has saved me a lot of driveway time.


    Agents, what is your lockbox story? I know you have one.


    #RealTalk #RealEstateLife'
  linkedin: 'Appointment confirmed Thursday. Lockbox code confirmed Friday. Forty-minute drive Saturday
    morning. Code does not work.


    The failure is never the lockbox. It is that the code changed and the showing instructions did not,
    and the two places holding that detail do not talk to each other.


    There is a small operational lesson in it that travels well past real estate. Any detail that lives
    in two systems will eventually disagree, and it will disagree at the least convenient moment. The
    fix is not better intentions. It is confirming the perishable detail as late as possible, and having
    a second contact who can actually answer.


    I confirm codes the morning of now. It costs two minutes.


    What is the detail in your process that keeps going stale?


    #RealEstate #RealTalk #Operations'
  tiktok: 'Confirmed the appointment. Confirmed the code. Drove forty minutes. Lockbox said no.


