captions:
  instagram: 'The appraisal came in under your offer. That is not automatically a dead deal.


    The CFPB''s guidance here is shorter than most people expect. Ask the seller to reduce the price, because the appraisal is strong evidence the price was above market value. If the seller won''t, you may want to cancel, and they say to consider consulting an attorney about your options.


    The third path people reach for is covering the gap in cash. CFPB is blunt about that one: buying a home for more than the appraised value is very risky.


    Whatever you pick, your purchase contract decides what cancelling costs. Read it before you decide, not after.


    (CFPB page reviewed Sept 2024.)


    DM me ''BUYER'' and I''ll walk you through where your offer actually stands.


    #FirstTimeHomeBuyer #HomeAppraisal #LongBeachRealEstate #SouthBayHomes #SoCalRealEstate #RealEstateTips'
  facebook: 'Your appraisal came back under your offer price. Before anyone panics, here is what the Consumer Financial Protection Bureau actually tells buyers to do.


    First, get your copy of the appraisal. Your lender is required to send it to you.


    Then ask the seller to reduce the price. The CFPB''s wording is that the lower appraised value can often be used to negotiate a reduction, and that the appraisal is strong evidence the price was above the market value of the home. It costs nothing to ask, and you are not asking for a favor. You are pointing at a professional opinion.


    If the seller won''t move, you may want to cancel. The CFPB says to consider consulting an attorney about your options, and notes that depending on your contract there may be costs to cancelling, but that those costs are likely small compared to buying a home that isn''t worth what you paid for it.


    What it does not point you toward is quietly writing a check for the difference. Their own summary of this situation is that it is very risky to purchase a home for more than the appraised value. People still do it sometimes, for reasons that make sense to them. Just do it with your eyes open rather than because you feel stuck.


    Two things that page does not say, and I''d rather be straight about it than fill in the gaps: it doesn''t discuss appraisal contingencies, and it gives no statistics on how often this happens or how often sellers come down. Your contract and your own market decide those.


    (CFPB page reviewed Sept 2024. General information.)


    Have you ever had an appraisal come in low? What did the seller end up doing?


    #HomeAppraisal #SoCalRealEstate'
  linkedin: 'When an appraisal lands under the contract price, the conversation usually jumps straight to who eats the difference. The CFPB''s own buyer guidance is narrower than that, and worth reading before advising anyone.


    It names two moves. Ask the seller to reduce the price, on the grounds that the appraisal is strong evidence the price sat above the market value of the home. And if the seller declines, consider cancelling, with an attorney consulted on the options and the purchase contract determining what cancellation costs.


    It also makes a flat risk statement: purchasing a home for more than the appraised value is very risky.


    What it does not do is walk through contingencies, describe a reconsideration-of-value process, or offer any figure on how often low appraisals get renegotiated. Anyone quoting a percentage there is quoting something else.


    The takeaway for agents and lenders: the appraisal is leverage before it is a problem, and the side that read the contract first tends to set the terms of the conversation.


    CFPB page reviewed Sept 2024. General information.


    How are low appraisals resolving on your side right now?


    #RealEstate #HomeBuying #Appraisal'
