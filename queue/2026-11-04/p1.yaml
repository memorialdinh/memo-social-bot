    Most people wait until they're "ready" to ask a single question. That's backwards.

    Fifteen minutes gets you three things: a value range for your home as it sits today, an honest list of what's worth fixing and what isn't, and a timeline that works around your next move instead of mine.

    A range is an estimate, not an appraisal. And no part of this needs you to list anything.

