  facebook: |-
    If you're even loosely thinking about selling next year, you don't need a plan yet. You need fifteen minutes.

    Here's what that covers. One, a value range for your home the way it actually is right now, not the way a website guesses. Two, what's worth fixing before it goes on the market and, just as useful, what you should leave alone because the money won't come back. Three, a timeline built around when you want to move, not when I'd like a listing.

    That's it. A range is an estimate, not an appraisal, and nothing about the call commits you to anything.

    👉 tidycal.com/memorialdinh/15-minute-call

    What would you most want answered first: the number, the repairs, or the timing?

    #HomeSelling #SellerTips
  linkedin: |-
    The most expensive thing a homeowner can do is plan a sale around a guess.

    I keep the first conversation to fifteen minutes on purpose, and it covers three things. A value range for the home in its current condition. A short, honest read on which improvements tend to return and which ones don't, which is usually the more surprising half. And a sequence, because the order of sell-then-buy versus buy-then-sell changes what someone can carry.

    A range is an estimate and not an appraisal. The point isn't to produce a listing; it's to replace assumptions with numbers early enough that they're still useful.

    tidycal.com/memorialdinh/15-minute-call

    For anyone who's sold recently: how far ahead did you start the planning, and would you start earlier?

