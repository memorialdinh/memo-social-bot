captions:
  instagram: |-
    Forty photos in the listing. Six of them are the same kitchen angle. One is a corner of the garage with a bike in it.

    Then you get there and the one room you actually wanted to see wasn't photographed at all.

    If you're the seller: fewer, better photos. If you're the buyer: go see it.

    #RealEstateHumor #HomeBuying #LongBeachRealEstate #SouthBayHomes #RealTalk #HouseHunting
  facebook: |-
    Forty photos in the listing. Six near-identical kitchen angles, two of the same hallway, and one mystery shot of a garage corner with a bike leaning in it.

    And then somehow not a single photo of the second bathroom, which is the one thing you wanted to see.

    I say this with love, because I've been on both sides of it. Fewer photos, better photos, and shoot the rooms people are actually going to ask about.

    What's the strangest photo you've seen in a listing?

    #RealEstateHumor #HouseHunting
  linkedin: |-
    A small, fixable thing I see constantly: listings with forty photos and no editorial judgement.

    Six variations of one kitchen angle, a hallway shot, a corner of the garage. Meanwhile the second bathroom, the yard's actual dimensions and the layout of the primary suite go unphotographed, which are the three things buyers ask about first.

    More images isn't more information. A tight set that answers the predictable questions does more work than a long one that doesn't.

    What's the shot you wish every listing included?

    #RealEstate #RealEstateMarketing #HomeSelling
