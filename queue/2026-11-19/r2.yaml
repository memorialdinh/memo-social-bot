captions:
  default: '"It''s only one month." It is almost never only one month.


    Here''s the order it actually happens in:


    1. The rent stops. One vacant month is a twelfth of that unit''s annual income, and it''s gone whether or not you fill it quickly.


    2. The turn starts. Clean, paint, the carpet, the fixes the last tenant''s deposit doesn''t fully cover. This is the part people forget to price.


    3. You market it. Photos, listing fees, showings, applications, screening. Mostly your time, which is still a cost.


    4. The gap keeps running. A signed lease is not money. Rent restarts the day they pay, and that''s often weeks after the handshake.


    Stack those four and a "one month" vacancy routinely runs longer and costs more than the rent you lost. Which is why holding a good tenant at slightly under market is sometimes the better financial decision, not the softer one.


    I''m not going to put a dollar figure on this, because yours depends on your unit, your market and your turn. DM me ''INVEST'' and I''ll send the worksheet to run your own.


