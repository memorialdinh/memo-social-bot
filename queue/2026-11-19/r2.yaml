  linkedin: 'Vacancy is the line item investors most often underprice, and the reason is that it gets modelled as lost rent alone.


    In sequence, one vacant month carries four costs:


    Lost rent. A twelfth of that unit''s annual income, unrecoverable regardless of how fast it refills.


    Turn cost. Cleaning, paint, flooring and deferred repairs, less whatever the departing deposit actually covers, which is usually less than expected.


    Re-letting cost. Photography, listing fees, showing time, application processing and screening. Largely time rather than cash, and time is the cost most spreadsheets omit.


    The lease-to-payment gap. Execution is not collection. Rent restarts on the first payment, not on signature, and that gap is frequently measured in weeks.


    The implication is a pricing decision rather than an operational one. Renewing a reliable tenant marginally below market often outperforms a turn at full market rent once all four lines are counted. That is arithmetic, not sentiment.


    Any dollar figure here would be specific to the unit and the market, so I''ve deliberately left them out.


    Investors and property managers: how do you carry vacancy in your underwriting?


