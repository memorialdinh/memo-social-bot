    #RealEstateAgent #RealtorLife #AgentGrowth #BrokerageMath #Epique'
  facebook: 'For the agents reading this: September closed sales in California were down 6.5% from a year ago. Statewide. That is the backdrop for every brokerage conversation happening right now.


    When volume thins out, the fees you stopped noticing start to matter. So before you move anywhere, including here, do the boring work:


    Add up your split, your cap, desk fee, tech fee, E and O, and anything charged per transaction. Divide by the deals you actually closed last year. That is your real cost per deal.


    Then ask the question most people skip: what changes the day after I cap? Get that answer in writing, not in a recruiting conversation.


    Revenue share and equity are part of the picture at some brokerages, subject to plan terms. Worth understanding how they vest before you weigh them.


    Happy to run your numbers next to a couple of other models. Message me MATH and I will put the comparison together.


    #RealEstateAgents #RealEstateCareer'
  linkedin: 'September closed sales in California were down 6.5% year over year, to 260,410 SAAR. Year-to-date volume is up just 0.8%.


    That environment changes how agents should evaluate a brokerage. In a high-volume year, a bad fee structure is annoying. In a thinner one, it is the difference between a profitable year and a flat one.


    A reasonable way to run it: total every fixed and variable cost you paid last year, including split, cap, desk, technology, E and O and per-transaction charges. Divide by closed transactions. That is your real cost per deal. Then compare models on that number, not on the split headline.


    Two questions that get skipped and should not be: what changes the day after I cap, and how does any equity or revenue share component vest? Both are subject to the plan terms in writing.


    Agents who have moved in the last two years: what did you wish you had modeled before you did?


    #RealEstate #RealEstateAgents #RealEstateCareer'
  tiktok: 'Agents, do you know your real cost per deal? Add every fee, then divide.


