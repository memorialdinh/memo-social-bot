  headline: More listings *don't* mean more leverage.
  myth: Inventory is up, so I can come in low.
  fact: Statewide active listings rose just 0.5% in a year while the median price still climbed 1.7%. Supply is 3.7 months.
  cta: DM 'BUYER' for my offer strategy
captions:
  instagram: '"There are more homes on the market, so I will just lowball."


    Check the actual numbers. Statewide active listings in September were up 2.7% from August but only 0.5% from a year ago. Supply sat at 3.7 months. The median price still finished up 1.7% year over year at $899,720.


    That is a market with a little more breathing room, not a clearance sale.


    Where you do have room: inspection items, credits, timelines, rate buydowns. That is where good offers get won.


    DM me BUYER and I will walk you through how I structure one.


    #FirstTimeHomeBuyer #HomeBuyingTips #LosAngelesRealEstate #OrangeCountyHomes #BuyerTips'
  facebook: 'I keep hearing a version of this: inventory is up, so I will come in low and see what happens.


    Here is what September actually looked like in California. Active listings were up 2.7% from August, but only 0.5% from a year ago. Months of supply held at 3.7. And the statewide median price still came in 1.7% higher than last September, at $899,720.


    So yes, there is a bit more to choose from and a little less elbowing. That is real. But it is not the same thing as sellers being desperate.


    The leverage buyers do have right now usually shows up somewhere other than the price: repair credits, closing cost help, a rate buydown, a timeline that works for you. That is where I spend my energy when I write an offer.


    Thinking about buying in the next few months? Comment BUYER and I will send you how I put an offer together.


    What is holding you back right now, the payment or the inventory?


    #LongBeachRealEstate #HomeBuying #SouthBay'
  linkedin: 'A correction worth making with buyers right now.


    September data from C.A.R.: statewide active listings up 2.7% month over month but only 0.5% year over year. Unsold Inventory Index steady at 3.7 months. Median price still up 1.7% year over year to $899,720, even as closed sales fell 6.5%.


    Read together, that is softening demand meeting constrained supply. C.A.R.''s chief economist made the same point: the rate lock-in effect keeps new listings scarce, and thin inventory cushions prices against weaker demand.


    The implication for anyone writing offers: price leverage is limited. Terms leverage is not. Credits, contingency timelines and buydowns are where the negotiation actually lives.


    Where are you seeing buyers win concessions?


    #RealEstate #HousingMarket #HomeBuying'
