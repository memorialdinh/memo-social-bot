captions:
  instagram: '$434 per square foot. That is the statewide median for a California single-family home in September, up from $427 a year ago.


    Useful number. Also the most misused number in real estate 👇


    Price per square foot ignores lot size. It ignores condition. It ignores whether that square footage is permitted. And it punishes smaller homes, because the kitchen and the bathrooms cost what they cost whether the house is 1,200 feet or 2,400.


    Use it to sort comps. Never use it alone to set a price or an offer.


    DM me INVEST and I will send you the comp checklist I actually run.


    #RealEstateInvesting #InvestorTips #CashFlow #LosAngelesRealEstate #RealEstateMath'
  facebook: 'The statewide median price per square foot in California hit $434 in September, up from $427 a year ago.


    It is a handy number for a quick gut check. It is also the number I see people lean on way too hard.


    Here is what price per square foot does not know about: your lot size, the condition of the roof and the systems, whether that converted garage was ever permitted, and the fact that a 1,200 square foot house still needs a full kitchen and two bathrooms. Small homes almost always look expensive per foot for that reason alone. Big ones look cheap.


    So use it the way a real appraiser does. Sort your comps with it, then adjust for the things it cannot see.


    If you want the comp checklist I run before making an offer on anything, comment INVEST and I will send it over.


    What is the last property where the per-foot number fooled you?


    #RealEstateInvesting #LongBeachRealEstate'
  linkedin: 'California''s median price per square foot reached $434 for single-family homes in September, up from $427 in September a year ago.


    Price per square foot is the most quoted and least understood metric in residential real estate. It is a normalizing tool, not a valuation.


    What it systematically misses: land value, which can dominate in infill LA and South Bay submarkets; condition and deferred capital items; permitted versus unpermitted square footage; and the fixed-cost problem, where a smaller home carries the same kitchen and bath build-out over fewer feet and therefore prints a higher per-foot number without being overpriced.


    Used properly it narrows a comp set. Used alone it produces confident, wrong numbers, in both directions.


    For investors and agents: sort with it, then adjust for what it cannot see.


    What adjustment do you find people skip most often?


    #RealEstate #RealEstateInvesting #PropertyValuation'
  tiktok: '$434 a square foot statewide. Here is why that number lies to you.


