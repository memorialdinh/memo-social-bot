  linkedin: 'In September 2026, 52.0% of active listings in Cypress carried a price reduction. In Lakewood the figure was 23.9%. Both are in the same regional market, in the same month.


    Across the cities I work, September 2026, per Realtor.com''s monthly ZIP-level inventory data: Cypress 52.0%, Redondo Beach 42.5%, Cerritos 33.3%, Torrance 32.0%, Lakewood 23.9%.


    A price-reduction share is a useful measure precisely because it records a decision rather than a sentiment. It is the proportion of sellers whose asking price and whose buyer pool did not agree, and who moved first. A higher share generally indicates more negotiating room; a lower one, less.


    Two caveats worth stating plainly. The measure is backward-looking - it describes September, not November, and not what comes next. And a city-level figure averages across price bands and property types that behave differently, which is why "the market" is a weaker unit of analysis than a submarket.


    The practical implication for anyone pricing a home or writing an offer this quarter: the relevant comparison set is the street and the price band, not the region.


    Source: Realtor.com Residential Data, monthly inventory by ZIP code, September 2026.


    For the agents and analysts here - which submarket in your area is furthest from its own city average right now?


