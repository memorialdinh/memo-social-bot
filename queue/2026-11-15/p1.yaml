    What a price cut actually tells you: the asking price and the buyers didn''t agree, and the seller moved first. A high share usually means more room to negotiate. A low share usually means less.


    What it doesn''t tell you: anything about next month. I''m telling you what September measured, and stopping there.


    So "is the market soft right now" is the wrong question. The right one is whether it''s soft on your street, in your price band, for your kind of home.


