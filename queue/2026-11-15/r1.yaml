captions:
  default: 'Most sellers read the price on a listing agreement and sign the rest.


    Four lines in there decide more than the price does:


    1. The term. How long it runs and the exact date it ends. Not "a few months" - a date.

    2. The commission. The total, and how it splits between the two sides. Ask it out loud so there''s no version of it you didn''t hear.

    3. The cancellation. How you get out, who has to agree, and whether anything is owed if you do.

    4. The protection period. Some agreements say that if a buyer the agent already brought you comes back and buys after the term ends, a commission is still owed. If that clause is in yours, know how long it runs.


    None of this is adversarial. It''s the same thing I''d want a client to ask me. An agent who explains all four without flinching is the one you want.


    General information, not legal advice. Your agreement is the one that governs - read yours, and ask your own counsel if anything is unclear.


    DM me ''AGREEMENT'' and I''ll send you the four questions to ask before you sign.


    #LongBeachRealEstate #SouthBayHomes #LakewoodCA #HomeSellingTips #ListingAgent #SoCalRealEstate'
  linkedin: 'A listing agreement is the only document in a sale that a seller signs before they have any leverage, and it is routinely the least-read.


    Four provisions do more work than the list price:


    The term, stated as an end date rather than a duration. The total commission and the split between sides, confirmed verbally as well as on the page. The cancellation mechanics - who must consent, and whether anything is owed on exit. And the protection or safety period, which in some agreements preserves a commission obligation if a buyer the agent previously introduced returns and closes after the term expires.


    The point is not that any of these are unreasonable. Each exists for a defensible reason. The point is that they are negotiable terms being presented at the moment of lowest seller attention, and that an agent who can walk through all four without defensiveness has given the seller something to evaluate.


    For the agents here: I would rather be asked these four questions than not. A client who understands the agreement argues with me less later, not more.


    General information, not legal advice. Terms vary by agreement and by state.


    #RealEstate #HomeSelling #RealEstateAdvice'
