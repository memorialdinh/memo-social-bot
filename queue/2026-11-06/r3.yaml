  facebook: |-
    Offer deadlines follow a law of nature and I have stopped fighting it.

    Nine in the morning, the email goes out: offers due at three. Nothing happens. Lunch comes and goes. Still nothing.

    2:58pm, my phone turns into a slot machine. Three buyers, two agents, one lender, all with a quick question that is not quick.

    And honestly, I get it. Deciding to spend that kind of money is the sort of thing a person puts off until the deadline makes them do it. I am the same way about plenty of things. It just makes for a very loud four minutes.

    The real reason I am posting this: if you are circling a home with a deadline on it, ask your questions the day before. The answers are better when nobody is typing them with one hand while on the phone, and your offer gets written properly instead of fast.

    Agents, buyers, sellers, what time does your phone go off? Mine has settled on 2:58.

    #RealEstateHumor #HomeBuying
  linkedin: |-
    An observation on deadlines, from a week of them.

    Set an offer deadline for 3pm and almost nothing arrives before 2:50. Then everything arrives at once: the buyers, the co-op agents, the lender, each with a question that needed twenty minutes and now has four.

    It is easy to read that as disorganization. I do not think it is. A deadline is what converts an open-ended decision into a decision, and people reliably use the whole runway they are given. The behaviour is predictable, so it should be planned for rather than complained about.

    What has actually helped on my side: push the disclosure package and the answers out early and in writing, and tell everyone the questions close at noon. The deadline stays at three. The scramble moves to a time when it can be handled properly, and the offers that arrive are better written.

    For anyone who runs deadlines in their own work, where do you build the buffer?

    #RealEstate #Negotiation #RealEstateHumor
