  linkedin: |-
    Orange County, September 2026, from the C.A.R. monthly release.

    The median price of an existing single-family home was $1,480,000, a 5.6% increase over the $1,401,250 median of September 2025. Median days on market was 30, against 33 a year earlier. The unsold inventory index held at 3.0 months, unchanged year over year, while closed sales were 2.0% below September 2025.

    What makes this set interesting is the combination: firmer pricing and marginally faster absorption on flat supply and slightly thinner volume. It is a materially different reading from the inland counties in the same month, which is the practical argument against treating a regional aggregate as a market signal. Composition matters too, since a median reflects which price bands transacted.

    For anyone underwriting or advising in this market, the useful unit of analysis remains the submarket and the price band, not the county.

    Source: California Association of REALTORS, September 2026 Home Sales and Price Report, as of September 2026.

