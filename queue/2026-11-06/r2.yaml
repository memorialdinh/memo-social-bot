  facebook: |-
    Orange County in September 2026, by the numbers that actually got reported.

    The median price for an existing single-family home came in at $1,480,000. A year earlier it was $1,401,250, so that is up 5.6%.

    Homes sold in a median 30 days, three days faster than September 2025. Unsold inventory sat at 3.0 months, identical to a year ago. Closed sales ran 2.0% below last September.

    Put together: a market where prices nudged up and homes moved a touch quicker, with supply flat and slightly fewer transactions. That is a tighter picture than Riverside or San Bernardino County looked in the same month, and it is a reminder that "Southern California" is not one market. Your city, your price band and your property type can all read differently from the county headline.

    Figures from the California Association of REALTORS, September 2026 Home Sales and Price Report, as of September 2026.

    I am not going to tell you what happens next, because I do not know and neither does anyone posting a forecast. This is what the month did.

