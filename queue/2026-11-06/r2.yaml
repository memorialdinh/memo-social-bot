  instagram: |-
    Orange County, September 2026. Two numbers worth sitting with.

    The median price of an existing single-family home was $1,480,000, up 5.6% from $1,401,250 a year earlier.

    Homes took a median 30 days to sell, down from 33 days in September 2025. Unsold inventory held at 3.0 months, the same as a year ago.

    So prices firmed up and homes moved slightly faster, on supply that did not budge. Closed sales were 2.0% lower than a year ago.

    Figures: California Association of REALTORS, September 2026 Home Sales and Price Report, as of September 2026.

