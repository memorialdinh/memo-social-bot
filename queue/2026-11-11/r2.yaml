captions:
  instagram: 'Pop quiz. In a California sale, who pays for the termite report?


    A) The seller, always

    B) The buyer, always

    C) Whoever the contract says


    It''s C. There''s no rule that assigns it. It''s a negotiated line in the purchase contract, and what''s "normal" shifts from one area to the next.


    Two things worth knowing as a seller. One, the report and the repairs are separate negotiations — agreeing to one is not agreeing to the other. Two, if you order it before you list, you control the timing and you''re not reacting to someone else''s inspector mid-escrow.


    Comment ''SELLER'' and I''ll send you my pre-listing prep list.


    General information, not legal advice.


    #SellingYourHome #HomeSellingTips #TermiteInspection #LongBeachRealEstate #SouthBayHomes #SoCalRealEstate'
  facebook: 'Quick one for sellers. Who pays for the termite report in a California sale?


    A) The seller, always

    B) The buyer, always

    C) Whoever the contract says


    The answer is C, and the reason it surprises people is that it gets talked about like a rule. It isn''t. It''s a line in the purchase contract that gets filled in, and what counts as customary genuinely varies by area and by who''s at the table.


    Two things I tell sellers about it.


    First, the report and the repairs are two separate conversations. Agreeing to pay for an inspection is not agreeing to fix what it finds. Those get negotiated separately, and treating them as one package is how sellers end up surprised.


    Second, there''s a real argument for ordering it before you list. Not because you have to, but because you find out what''s there while you still have time and options. Finding out mid-escrow, from a report someone else ordered, puts you on their schedule and their framing.


    This is general information, not legal advice — your own situation and your contract are what govern.


    Sellers, did you order yours before listing or wait?


    #HomeSellingTips #SoCalRealEstate'
  linkedin: 'A question that reliably reveals how much of residential practice is custom rather than rule: in a California sale, who pays for the wood-destroying pest report?


    A) The seller, always

    B) The buyer, always

    C) Whoever the contract says


    The answer is C. Responsibility is a negotiated contract term, and what is treated as customary differs by region and by transaction. Nothing assigns it by default.


    The practical insight for sellers: the inspection and the repairs are distinct negotiations, and conflating them is a common and expensive error. Ordering the report pre-listing is worth considering less for the cost allocation than for the control of timing — information obtained before marketing is leverage, and the same information obtained mid-escrow is a concession.


    General information, not legal advice.


    For the practitioners here: what is customary in your market, and has it shifted?


    #RealEstate #HomeSelling #PropertyTransactions'
